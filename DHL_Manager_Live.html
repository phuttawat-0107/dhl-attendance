<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DHL Manager Live</title>
<style>
:root{--y:#FFCC00;--r:#D40511;--k:#1a1a1a;--g:#2e7d32;--am:#b58900;--muted:#a09884;--bg:#f7f4ee;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI','Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);min-height:100vh;color:var(--k);padding-bottom:40px;-webkit-font-smoothing:antialiased;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
.topbar{position:sticky;top:0;z-index:50;background:rgba(247,244,238,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.ybar{height:6px;background:linear-gradient(90deg,#FFCC00,#ffb700);}
.hd{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;}
.mlogo{font-size:22px;font-weight:900;font-style:italic;} .mlogo span{color:var(--r);}
.live{font-size:10.5px;font-weight:800;color:var(--g);display:flex;align-items:center;gap:5px;justify-content:flex-end;}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);animation:blink 1.6s infinite;font-style:normal;}
.hd .meta{text-align:right;font-size:11px;color:var(--muted);}
.wrap{max-width:900px;margin:0 auto;padding:12px;}
.card{background:#fff;border-radius:22px;box-shadow:0 1px 6px rgba(60,50,20,.07);padding:15px;margin-bottom:11px;animation:fadeUp .3s ease;}
h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.small{font-size:11.5px;color:var(--muted);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:11px;}
.kpi{background:#fff;border-radius:18px;padding:11px;box-shadow:0 1px 5px rgba(60,50,20,.06);position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:#e9e2d2;}
.kpi.red::before{background:var(--r);} .kpi.green::before{background:var(--g);} .kpi.am::before{background:var(--y);}
.kpi .v{font-size:23px;font-weight:800;line-height:1;} .kpi .l{font-size:10px;color:#8a8272;font-weight:600;margin-top:3px;}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px;}
table.grid{width:100%;border-collapse:separate;border-spacing:4px;font-size:12px;}
table.grid th{font-size:9.5px;color:#a09884;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:2px;text-align:center;white-space:nowrap;}
table.grid th.tg{color:var(--r);font-size:8.5px;display:block;font-weight:700;}
td.dep{font-weight:900;font-size:14px;text-align:left;padding-right:6px;white-space:nowrap;}
td.dep small{display:block;font-size:9.5px;color:#a09884;font-weight:600;}
td.cell{border-radius:13px;text-align:center;padding:9px 5px;cursor:pointer;background:#f2ede2;color:#b0a892;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1);min-width:62px;}
td.cell:active{transform:scale(.93);}
td.cell b{display:block;font-size:14px;font-weight:800;line-height:1.15;}
td.cell span{font-size:9px;font-weight:700;opacity:.85;}
td.cell.ok{background:#e6f5eb;color:#1c7a4d;} td.cell.bad{background:#fdeaea;color:#b3121d;}
td.cell.wait{background:#fff6d6;color:#8a6d00;}
td.cell.hascom{box-shadow:inset 0 0 0 2.5px var(--r);}
.dot{position:absolute;} .cellwrap{position:relative;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:#8a8272;margin-top:9px;font-weight:600;}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;vertical-align:-1px;margin-right:4px;font-style:normal;}
.btn{border:none;border-radius:99px;padding:12px 15px;font-size:13.5px;font-weight:800;cursor:pointer;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);font-family:inherit;}
.btn:active{transform:scale(.93);}
.btn-y{background:#1a1a1a;color:var(--y);} .btn-o{background:#f2ede2;color:#5a5140;}
.btn-r{background:linear-gradient(135deg,#e6212e,#D40511);color:#fff;} .btn-block{width:100%;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;align-items:flex-end;justify-content:center;}
.modal.show{display:flex;}
.sheet{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:20px;animation:fadeUp .28s ease;}
.sheet h3{font-size:18px;margin-bottom:3px;} .sheet .sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.row-c{display:flex;align-items:center;gap:10px;background:#fbf9f4;border-radius:16px;padding:9px 12px;margin-bottom:6px;}
.row-c .info{flex:1;min-width:0;} .row-c .nm{font-weight:700;font-size:13px;}
.row-c .sub2{font-size:10.5px;color:#a09884;}
.chip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap;}
.chip.ok{background:#dff3e6;color:#1c7a4d;} .chip.no{background:#fbdfdd;color:#b3261e;}
textarea{width:100%;border:none;background:#f2ede2;border-radius:16px;padding:13px;font-size:14px;
  font-family:inherit;min-height:88px;resize:vertical;color:#3a3428;}
textarea:focus{outline:2px solid var(--y);}
.cm{background:#fff8d9;border-radius:15px;padding:12px;margin-bottom:8px;}
.cm.done{background:#f3faf5;} .cm .t{font-size:10.5px;color:#a09884;font-weight:700;margin-bottom:3px;}
.cm .x{font-size:13.5px;line-height:1.5;} .cm .ok2{font-size:11px;color:#1c7a4d;font-weight:800;margin-top:5px;}
.photo{width:100%;border-radius:14px;margin-top:8px;}
.thumb{width:52px;height:52px;border-radius:11px;object-fit:cover;background:#eee;flex-shrink:0;}
#login{position:fixed;inset:0;z-index:9999;background:linear-gradient(165deg,#1a1a1a,#2a2a2a);display:flex;align-items:center;justify-content:center;padding:24px;}
#login .box{background:#fff;border-radius:28px;padding:26px 22px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);}
#login h3{font-size:21px;font-weight:800;margin-bottom:3px;} #login p{font-size:12.5px;color:#a09884;margin-bottom:16px;}
#login input{width:100%;padding:13px;border:none;border-radius:14px;background:#f2ede2;font-size:22px;
  letter-spacing:6px;text-align:center;font-weight:700;margin-bottom:12px;font-family:inherit;}
#login .yb{height:5px;background:linear-gradient(90deg,#FFCC00,#ffb700);border-radius:99px;margin-bottom:16px;}
#login .err{color:var(--r);font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:6px;}
.empty{text-align:center;color:#b0a892;padding:40px 10px;font-size:13px;}
.mtabs{display:flex;gap:5px;background:#fff;border-radius:99px;padding:5px;box-shadow:0 1px 6px rgba(60,50,20,.08);margin-bottom:11px;}
.mtab{flex:1;border:none;border-radius:99px;padding:11px 4px;font-weight:800;font-size:13px;background:none;color:#a09884;
  cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);font-family:inherit;}
.mtab.on{background:#1a1a1a;color:var(--y);transform:scale(1.03);}
.iss{display:flex;gap:11px;align-items:flex-start;border-radius:16px;padding:12px 13px;margin-bottom:8px;background:#fbf9f4;cursor:pointer;transition:transform .16s;}
.iss:active{transform:scale(.99);}
.iss.crit{background:#fff1f0;box-shadow:inset 3.5px 0 0 var(--r);}
.iss.warn{background:#fff8e0;box-shadow:inset 3.5px 0 0 var(--y);}
.iss .ic{font-size:20px;line-height:1;flex-shrink:0;margin-top:1px;}
.iss .bd{flex:1;min-width:0;} .iss .ti{font-weight:800;font-size:13.5px;}
.iss .de{font-size:11.5px;color:#8a8272;margin-top:2px;line-height:1.45;}
.iss .go{font-size:11px;font-weight:800;color:var(--r);white-space:nowrap;align-self:center;}
.stepgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;}
.stepcard{background:#fbf9f4;border-radius:16px;padding:12px;cursor:pointer;}
.stepcard .h{font-weight:800;font-size:12.5px;margin-bottom:3px;}
.stepcard .n{font-size:21px;font-weight:800;line-height:1.1;}
.stepcard .s{font-size:10.5px;color:#8a8272;font-weight:600;margin-top:2px;}
.stepbar{display:flex;gap:3px;margin-top:8px;}
.stepbar i{flex:1;height:7px;border-radius:99px;background:#ece5d5;font-style:normal;}
.stepbar i.ok{background:var(--g);} .stepbar i.bad{background:var(--r);} .stepbar i.wait{background:var(--y);}
</style>
</head>
<body>

<div id="login"><div class="box"><div class="yb"></div>
  <h3>DHL Manager</h3><p>ใส่ PIN ผู้จัดการเพื่อดูภาพรวมสด 7 สาขา</p>
  <input id="mgPin" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••">
  <div class="err" id="mgErr"></div>
  <button class="btn btn-y btn-block" id="mgGo">เข้าใช้งาน</button>
</div></div>

<div class="topbar"><div class="ybar"></div>
  <div class="hd">
    <div class="mlogo">DHL <span>Live</span></div>
    <div class="meta" style="display:flex;align-items:center;gap:10px;">
      <div><div class="live"><i></i>REAL-TIME</div><span id="clk">--:--:--</span></div>
      <button class="btn btn-o" style="min-height:38px;padding:8px 12px;font-size:15px;" onclick="window.__settings()">⚙️</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="mtabs">
    <button class="mtab on" id="tb_live" onclick="window.__tab('live')">🔴 Live</button>
    <button class="mtab" id="tb_ins" onclick="window.__tab('ins')">📈 อินไซต์</button>
    <button class="mtab" id="tb_ch" onclick="window.__tab('ch')">📊 กราฟ</button>
  </div>
  <div id="viewLive">
  <div id="kpis"></div>
  <div class="card">
    <h2>🗓 <span id="dTitle">วันนี้</span> <span class="small" id="dSub"></span></h2>
    <div class="gridwrap"><table class="grid" id="grid"></table></div>
    <div class="legend">
      <span><i style="background:#e6f5eb"></i>ทันเป้า</span>
      <span><i style="background:#fdeaea"></i>เกินเป้า</span>
      <span><i style="background:#fff6d6"></i>กำลังทำ</span>
      <span><i style="background:#f2ede2"></i>ยังไม่เริ่ม</span>
      <span><i style="box-shadow:inset 0 0 0 2.5px #D40511;background:#fff"></i>มีคอมเมนต์</span>
    </div>
    <div class="small" style="margin-top:8px;">แตะช่องใดก็ได้เพื่อดูรายละเอียด รูปถ่าย และส่งคอมเมนต์</div>
  </div>
  <div id="side"></div>
  </div>
  <div id="viewIns" style="display:none;"></div>
  <div id="viewCh" style="display:none;"></div>
</div>

<div class="modal" id="mdl"><div class="sheet" id="mdlBody"></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, updateDoc,
         query, where, getDocs, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyAtPH24o4_Iaj81xD6lg5FGjDU9XIzKUAo",
  authDomain: "dhl-attendance-747ba.firebaseapp.com",
  projectId: "dhl-attendance-747ba",
  storageBucket: "dhl-attendance-747ba.firebasestorage.app",
  messagingSenderId: "32188572532",
  appId: "1:32188572532:web:17c975530ba03ab1574221"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);

const DEPOTS=['PHI','BPE','PWT','PKS','DST','BPL','PWN'];
const TASKS=[
  {k:'checkin',l:'เข้างาน',tg:'07:00'},
  {k:'pd',     l:'PD',     tg:'<07:15'},
  {k:'fib',    l:'First IB',tg:''},
  {k:'lib',    l:'Last IB', tg:''},
  {k:'dep',    l:'Departure',tg:'<08:30'},
  {k:'fdel',   l:'First Del',tg:'<09:00'}
];
const CUT=25200, GRACE=25800, PD_END=7*3600+15*60, T_DEP=8*3600+1800, T_FDEL=9*3600;
const pad=n=>String(n).padStart(2,'0');
const secOf=ts=>{const d=new Date(ts);return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();};
const fmtT=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const hmOf=s=>{const m=Math.round(s/60);return pad(Math.floor(m/60))+':'+pad(m%60);};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const thD=k=>{const[y,m,d]=k.split('-').map(Number);const mo=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return d+' '+mo[m-1]+' '+(y+543);};

const DATA={}, COM={};
let DATE=todayKey(), unsubs=[];

/* ---------- LOGIN ---------- */
document.getElementById('mgGo').onclick=login;
document.getElementById('mgPin').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
async function login(){
  const pin=document.getElementById('mgPin').value.trim(), err=document.getElementById('mgErr');
  if(!/^\d{4,6}$/.test(pin)){ err.textContent='PIN ต้องเป็นตัวเลข 4–6 หลัก'; return; }
  err.textContent='กำลังตรวจสอบ...';
  try{
    const ref=doc(db,'config','manager'), snap=await getDoc(ref);
    if(snap.exists()){
      if(snap.data().pin!==pin){ err.textContent='PIN ไม่ถูกต้อง'; return; }
    } else await setDoc(ref,{pin, createdAt:Date.now()});   // ครั้งแรก = ตั้ง PIN
    try{ localStorage.setItem('mgPin',pin); }catch(e){}
    document.getElementById('login').style.display='none';
    start();
  }catch(e){ err.textContent='เชื่อมต่อไม่ได้: '+e.message; }
}

/* ---------- START LISTENERS ---------- */
function start(){
  unsubs.forEach(u=>u()); unsubs=[];
  DEPOTS.forEach(dep=>{
    unsubs.push(onSnapshot(doc(db,'depots',dep,'days',DATE), s=>{
      DATA[dep]= s.exists()? s.data() : null; render();
    }, e=>console.warn(dep,e)));
    unsubs.push(onSnapshot(query(collection(db,'depots',dep,'comments'), where('date','==',DATE)), s=>{
      COM[dep]=s.docs.map(d=>({id:d.id,...d.data()})); render();
    }, e=>console.warn(dep+' com',e)));
  });
  render();
}

/* ---------- คำนวณสถานะแต่ละ Task ---------- */
function taskState(dep,k){
  const d=DATA[dep];
  if(!d) return {st:'none'};
  const ck=Object.values(d.checkins||{}), p=d.pph||{};
  const rp=Object.values(p.rp||{});
  if(k==='checkin'){
    if(!ck.length) return {st:'none'};
    const late=ck.filter(r=>r.status==='late').length;
    return {st: late? 'bad':'ok', v:(ck.length-late)+'/'+ck.length, s2: late? late+' สาย':'ตรงเวลา'};
  }
  if(k==='pd'){
    const ts=p.pd&&p.pd.ts;
    if(!ts) return {st: ck.length?'wait':'none'};
    return {st: secOf(ts)<=PD_END?'ok':'bad', v:fmtT(ts), s2:'PD'};
  }
  if(k==='fib'){
    if(!p.inboundTs) return {st: ck.length?'wait':'none'};
    return {st:'ok', v:fmtT(p.inboundTs), s2:'First IB'};
  }
  if(k==='lib'){
    if(!p.lastInboundTs) return {st: p.inboundTs?'wait':'none'};
    return {st:'ok', v:fmtT(p.lastInboundTs), s2:'Last IB'};
  }
  if(k==='dep'){
    const deps=rp.map(x=>x.dep).filter(Boolean);
    if(!deps.length) return {st: p.inboundTs?'wait':'none'};
    const a=av(deps.map(secOf));
    const done=deps.length, tot=(+p.courierN)||ck.length||done;
    return {st: done<tot? 'wait' : (a<T_DEP?'ok':'bad'), v:hmOf(a), s2:done+'/'+tot+' คน'};
  }
  if(k==='fdel'){
    const fd=rp.map(x=>x.fdel).filter(Boolean);
    if(!fd.length) return {st: rp.some(x=>x.dep)?'wait':'none'};
    const a=av(fd.map(secOf));
    const done=fd.length, tot=(+p.courierN)||ck.length||done;
    return {st: done<tot? 'wait' : (a<T_FDEL?'ok':'bad'), v:hmOf(a), s2:done+'/'+tot+' คน'};
  }
  return {st:'none'};
}

/* ---------- RENDER ---------- */
function render(){
  document.getElementById('dTitle').textContent = DATE===todayKey()? 'วันนี้ '+thD(DATE) : thD(DATE);
  const live=DEPOTS.filter(d=>DATA[d]).length;
  document.getElementById('dSub').textContent = '• มีข้อมูล '+live+'/'+DEPOTS.length+' สาขา';

  /* KPI */
  let on=0,late=0,pdOk=0,pdAll=0,fdOk=0,fdAll=0,comOpen=0;
  DEPOTS.forEach(dep=>{
    const d=DATA[dep]; if(d){
      Object.values(d.checkins||{}).forEach(r=> r.status==='late'? late++ : on++);
      const p=d.pph||{};
      if(p.pd&&p.pd.ts){ pdAll++; if(secOf(p.pd.ts)<=PD_END) pdOk++; }
      const fd=Object.values(p.rp||{}).map(x=>x.fdel).filter(Boolean);
      if(fd.length){ fdAll++; if(av(fd.map(secOf))<T_FDEL) fdOk++; }
    }
    comOpen += (COM[dep]||[]).filter(c=>!c.ackAt).length;
  });
  const tot=on+late, pct=tot?Math.round(on/tot*100):0;
  document.getElementById('kpis').innerHTML='<div class="kpis">'
    +'<div class="kpi '+(pct>=95?'green':(pct>=85?'am':(tot?'red':'')))+'"><div class="v">'+(tot?pct+'%':'—')+'</div><div class="l">Ontime รวม</div></div>'
    +'<div class="kpi '+(late?'red':'green')+'"><div class="v">'+late+'</div><div class="l">สายวันนี้</div></div>'
    +'<div class="kpi '+(pdAll&&pdOk===pdAll?'green':(pdAll?'red':''))+'"><div class="v">'+pdOk+'/'+pdAll+'</div><div class="l">PD ทันเวลา</div></div>'
    +'<div class="kpi '+(comOpen?'red':'green')+'"><div class="v">'+comOpen+'</div><div class="l">คอมเมนต์รอรับทราบ</div></div>'
    +'</div>';

  /* GRID */
  let h='<tr><th></th>'+TASKS.map(t=>'<th>'+t.l+(t.tg?'<span class="tg">'+t.tg+'</span>':'')+'</th>').join('')+'</tr>';
  DEPOTS.forEach(dep=>{
    const d=DATA[dep];
    const n=d? Object.keys(d.checkins||{}).length : 0;
    h+='<tr><td class="dep">'+dep+'<small>'+(d? n+' คน':'ไม่มีข้อมูล')+'</small></td>';
    TASKS.forEach(t=>{
      const s=taskState(dep,t.k);
      const hasCom=(COM[dep]||[]).some(c=>c.task===t.k&&!c.ackAt);
      h+='<td class="cell '+(s.st==='none'?'':s.st)+(hasCom?' hascom':'')+'" onclick="window.__open(\''+dep+'\',\''+t.k+'\')">'
        +'<b>'+(s.v||'—')+'</b><span>'+(s.s2||'')+'</span></td>';
    });
    h+='</tr>';
  });
  document.getElementById('grid').innerHTML=h;

  /* คอมเมนต์ที่ยังไม่รับทราบ */
  const open=[];
  DEPOTS.forEach(dep=>(COM[dep]||[]).forEach(c=>{ if(!c.ackAt) open.push({dep,...c}); }));
  document.getElementById('side').innerHTML = open.length
    ? '<div class="card"><h2>💬 คอมเมนต์ที่รอสาขารับทราบ</h2>'
      +open.sort((a,b)=>(b.at||0)-(a.at||0)).map(c=>
        '<div class="cm"><div class="t">'+esc(c.dep)+' • '+(TASKS.find(t=>t.k===c.task)||{l:c.task}).l+' • '+fmtT(c.at||Date.now())+'</div>'
        +'<div class="x">'+esc(c.text)+'</div></div>').join('')
      +'</div>'
    : '';
  if(MTAB==='ins') renderIns();
  if(MTAB==='ch') renderCh();
}

/* ================= 📈 INSIGHT: วิเคราะห์ปัญหา ================= */
let MTAB='live', HIST=null, histLoading=false;
window.__tab=t=>{
  MTAB=t;
  ['live','ins','ch'].forEach(k=>{
    const b=document.getElementById('tb_'+(k==='live'?'live':k));
    if(b) b.classList.toggle('on',t===k);
  });
  document.getElementById('viewLive').style.display= t==='live'?'':'none';
  document.getElementById('viewIns').style.display = t==='ins'?'':'none';
  document.getElementById('viewCh').style.display  = t==='ch'?'':'none';
  if(t==='ins'){ renderIns(); if(!HIST&&!histLoading) loadHist(); }
  if(t==='ch'){ renderCh(); if(!HIST&&!histLoading) loadHist(); }
};

function nowSec(){ const d=new Date(); return d.getHours()*3600+d.getMinutes()*60; }
function pphOf(p,n){
  const totalP=(+p.pNew||0)+(+p.pOld||0), people=(+p.staffN||0)+(+p.sorterN||0)+(+p.courierN||0);
  const rps=Object.values(p.rp||{}), fs=rps.filter(x=>x.fs).map(x=>x.fs);
  let sort=null,route=null;
  if(p.inboundTs&&n>0&&fs.length>=n&&people>0){
    const avgFs=av(fs); if(avgFs>p.inboundTs){ const hrs=(avgFs-p.inboundTs)/3600000; sort=totalP/(people*hrs); }
  }
  const pr=rps.filter(x=>x.fs&&x.dep&&x.dep>x.fs);
  if(pr.length){ const mh=pr.reduce((a,x)=>a+(x.dep-x.fs),0)/3600000; if(mh>0) route=totalP/mh; }
  return {sort,route,totalP,people};
}

/* กติกาตรวจปัญหา — คืน array ของ issue */
function findIssues(){
  const out=[], t=nowSec(), isToday = DATE===todayKey();
  DEPOTS.forEach(dep=>{
    const d=DATA[dep];
    if(!d){
      if(!isToday||t>=7*3600+30*60)
        out.push({dep,task:'checkin',lv:'crit',ic:'📵',ti:dep+' ยังไม่ส่งข้อมูลเลย',
          de:'ไม่พบการเช็คอินหรือบันทึกใดๆ ของวันนี้ — ตรวจว่าสาขาเปิดแอปและล็อกอินแล้วหรือยัง'});
      return;
    }
    const ck=Object.values(d.checkins||{}), p=d.pph||{}, rp=Object.values(p.rp||{});
    const nC=(+p.courierN)||ck.length||0;

    /* 1) เช็คอิน */
    const lateArr=Object.entries(d.checkins||{}).filter(([,r])=>r.status==='late');
    if(lateArr.length){
      const mins=lateArr.map(([,r])=>Math.max(1,Math.round((secOf(r.ts)-CUT)/60)));
      const worst=Math.max(...mins), sum=mins.reduce((a,b)=>a+b,0);
      out.push({dep,task:'checkin',lv:lateArr.length>=3?'crit':'warn',ic:'⏰',
        ti:dep+' มาสาย '+lateArr.length+' คน',
        de:'รวม '+sum+' นาที • สายสุด '+worst+' นาที — แตะดูรายชื่อและส่งคอมเมนต์'});
    }
    const noUni=ck.filter(r=>r.uniform===false).length;
    if(noUni) out.push({dep,task:'checkin',lv:'warn',ic:'👕',ti:dep+' ไม่ใส่ยูนิฟอร์ม '+noUni+' คน',
      de:'ตรวจสอบและเตือนก่อนออกวิ่งงาน'});
    const edits=ck.filter(r=>r.manualEdit).length;
    if(edits>=2) out.push({dep,task:'checkin',lv:'warn',ic:'✏️',ti:dep+' แก้เวลาเข้างาน '+edits+' ครั้ง',
      de:'แก้หลายครั้งผิดปกติ — ตรวจว่าเป็นเหตุผลอะไร (กล้องเสีย/ลืมกด)'});

    /* 2) PD */
    const pdTs=p.pd&&p.pd.ts;
    if(pdTs && secOf(pdTs)>PD_END)
      out.push({dep,task:'pd',lv:'crit',ic:'📸',ti:dep+' PD เกินเวลา ('+fmtT(pdTs)+')',
        de:'เป้าคือก่อน 07:15 — เลยมา '+Math.round((secOf(pdTs)-PD_END)/60)+' นาที'});
    if(!pdTs && ck.length && (!isToday || t>7*3600+20*60))
      out.push({dep,task:'pd',lv:'crit',ic:'📸',ti:dep+' ยังไม่ถ่าย PD',
        de:'เช็คอินแล้ว '+ck.length+' คน แต่ยังไม่มีภาพ PD — เลยเวลา 07:15 ไปแล้ว'});

    /* 3) Inbound / Sort */
    if(!p.inboundTs && ck.length && (!isToday || t>7*3600))
      out.push({dep,task:'fib',lv:'warn',ic:'📥',ti:dep+' ยังไม่กด First Inbound',
        de:'ระบบจะคำนวณ PPH Sort ไม่ได้จนกว่าจะกดจุดนี้'});
    const fsDone=rp.filter(x=>x.fs).length;
    if(p.inboundTs && nC && fsDone<nC && (!isToday || t>8*3600))
      out.push({dep,task:'fib',lv:'warn',ic:'🔀',ti:dep+' กด FS ไม่ครบ ('+fsDone+'/'+nC+')',
        de:'PPH Sort จะยังไม่ถูกคำนวณจนกว่าจะกด First Scan ครบทุกคน'});
    const P=pphOf(p,nC);
    if(P.sort!=null && P.sort<49)
      out.push({dep,task:'fib',lv:'warn',ic:'📉',ti:dep+' PPH Sort ต่ำกว่าเป้า ('+(Math.round(P.sort*10)/10)+')',
        de:'เป้า ≥ 49 • พัสดุ '+P.totalP+' ชิ้น ใช้คน '+P.people+' คน — ลองลดคนหรือลดเวลา Inbound→FS'});

    /* 4) Route prep / DEP */
    const deps=rp.map(x=>x.dep).filter(Boolean);
    if(deps.length){
      const a=av(deps.map(secOf));
      if(deps.length>=nC && a>=T_DEP)
        out.push({dep,task:'dep',lv:'crit',ic:'🚚',ti:dep+' Departure เฉลี่ยเกิน 08:30 ('+hmOf(a)+')',
          de:'ออกช้า '+Math.round((a-T_DEP)/60)+' นาที — กระทบ First Del ต่อเนื่อง'});
      const slow=Object.entries(p.rp||{}).filter(([,q])=>q.dep&&secOf(q.dep)>=T_DEP);
      if(slow.length && slow.length<nC)
        out.push({dep,task:'dep',lv:'warn',ic:'🐢',ti:dep+' ออกช้าเป็นรายคน '+slow.length+' คน',
          de:'บางคนออกเกิน 08:30 — แตะดูว่าใครและช้าที่ขั้นตอนไหน'});
    } else if(p.inboundTs && (!isToday || t>8*3600+30*60))
      out.push({dep,task:'dep',lv:'crit',ic:'🚚',ti:dep+' ยังไม่มีใครกด DEP',
        de:'เลย 08:30 แล้วแต่ยังไม่มีการบันทึกเวลาออก'});
    if(P.route!=null && P.route<165)
      out.push({dep,task:'dep',lv:'warn',ic:'📦',ti:dep+' PPH Route prep ต่ำกว่าเป้า ('+Math.round(P.route)+')',
        de:'เป้า ≥ 165 — เวลาที่ใช้ FS→DEP นานเกินไปเทียบกับปริมาณพัสดุ'});

    /* 5) First Del */
    const fd=rp.map(x=>x.fdel).filter(Boolean);
    if(fd.length){
      const a=av(fd.map(secOf));
      if(fd.length>=nC && a>=T_FDEL)
        out.push({dep,task:'fdel',lv:'crit',ic:'🎯',ti:dep+' First Del เฉลี่ยเกิน 09:00 ('+hmOf(a)+')',
          de:'ช้ากว่าเป้า '+Math.round((a-T_FDEL)/60)+' นาที — ตรวจ Stem Out และเส้นทางแรก'});
      const bigStem=Object.entries(p.rp||{}).filter(([,q])=>q.dep&&q.fdel&&(q.fdel-q.dep)/60000>35);
      if(bigStem.length)
        out.push({dep,task:'fdel',lv:'warn',ic:'⏱',ti:dep+' Stem Out นานผิดปกติ '+bigStem.length+' คน',
          de:'ใช้เวลาจาก DEP→จุดส่งแรกเกิน 35 นาที — อาจเป็นเส้นทางไกลหรือหลงทาง'});
    } else if(deps.length && (!isToday || t>9*3600))
      out.push({dep,task:'fdel',lv:'crit',ic:'🎯',ti:dep+' ยังไม่มีใครกด First Del',
        de:'ออกไปแล้วแต่ยังไม่บันทึกการส่งชิ้นแรก — เลย 09:00 แล้ว'});

    /* 6) คอมเมนต์ค้าง */
    const pend=(COM[dep]||[]).filter(c=>!c.ackAt).length;
    if(pend) out.push({dep,task:(COM[dep].find(c=>!c.ackAt)||{}).task||'checkin',lv:'warn',ic:'💬',
      ti:dep+' ยังไม่รับทราบคอมเมนต์ '+pend+' รายการ', de:'ส่งไปแล้วแต่สาขายังไม่กดรับทราบ'});
  });
  const rank={crit:0,warn:1};
  return out.sort((a,b)=>rank[a.lv]-rank[b.lv]);
}

async function loadHist(){
  histLoading=true;
  const days=[];
  for(let i=1;i<=7;i++){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const H={};
  for(const dep of DEPOTS){
    H[dep]=[];
    for(const dk of days){
      try{ const s=await getDoc(doc(db,'depots',dep,'days',dk)); if(s.exists()) H[dep].push(s.data()); }catch(e){}
    }
  }
  HIST=H; histLoading=false;
  if(MTAB==='ins') renderIns();
  if(MTAB==='ch') renderCh();
}

let CHDEP='all';
const PAL=['#D40511','#1565c0','#2e7d32','#b58900','#7a3b8f','#00838f','#e64a19'];
const METRICS=[
  {k:'ontime',l:'Ontime %',       unit:'%', tgt:95,    fmt:v=>Math.round(v)+'%',  hi:true},
  {k:'pd',    l:'เวลาถ่าย PD',     unit:'t', tgt:PD_END,fmt:v=>hmOf(v),           hi:false},
  {k:'sort',  l:'PPH Sort time',   unit:'n', tgt:49,   fmt:v=>Math.round(v*10)/10,hi:true},
  {k:'route', l:'PPH Route prep',  unit:'n', tgt:165,  fmt:v=>Math.round(v),      hi:true},
  {k:'dep',   l:'Departure เฉลี่ย', unit:'t', tgt:T_DEP,fmt:v=>hmOf(v),           hi:false},
  {k:'fdel',  l:'First Del เฉลี่ย', unit:'t', tgt:T_FDEL,fmt:v=>hmOf(v),          hi:false},
  {k:'late',  l:'จำนวนคนมาสาย',    unit:'n', tgt:0,    fmt:v=>Math.round(v)+' คน',hi:false}
];
function metricOf(d,k){
  if(!d) return null;
  const ck=Object.values(d.checkins||{}), p=d.pph||{}, rp=Object.values(p.rp||{});
  const nC=(+p.courierN)||ck.length||0;
  if(k==='ontime'){ if(!ck.length) return null; return ck.filter(r=>r.status!=='late').length/ck.length*100; }
  if(k==='late'){ if(!ck.length) return null; return ck.filter(r=>r.status==='late').length; }
  if(k==='pd'){ return (p.pd&&p.pd.ts)? secOf(p.pd.ts):null; }
  if(k==='sort'){ return pphOf(p,nC).sort; }
  if(k==='route'){ return pphOf(p,nC).route; }
  if(k==='dep'){ const a=rp.map(x=>x.dep).filter(Boolean); return a.length? av(a.map(secOf)):null; }
  if(k==='fdel'){ const a=rp.map(x=>x.fdel).filter(Boolean); return a.length? av(a.map(secOf)):null; }
  return null;
}
function chDates(){

}
function dayDoc(dep,dk){

function cvx(id,hpx){
  const c=document.getElementById(id); if(!c) return null;
  const dpr=window.devicePixelRatio||1, w=c.clientWidth||600, hh=hpx||150;
  c.width=w*dpr; c.height=hh*dpr; c.style.height=hh+'px';
  const x=c.getContext('2d'); x.scale(dpr,dpr); return {x,w,h:hh};
}
function drawMetric(m,deps){
  const cv=cvx('ch_'+m.k,150); if(!cv) return;
  const {x,w,h}=cv, dks=chDates(), PB=20,PT=10,PL=44,PR=10;
  const series=deps.map((dep,i)=>({dep,col:PAL[DEPOTS.indexOf(dep)%PAL.length],
    pts:dks.map(dk=>metricOf(dayDoc(dep,dk),m.k))}));
  const vals=series.flatMap(s=>s.pts).filter(v=>v!=null);
  const lg=document.getElementById('lg_'+m.k);
  if(!vals.length){
    x.fillStyle='#c4bca6'; x.font='13px Segoe UI'; x.textAlign='center';
    x.fillText('ยังไม่มีข้อมูลในช่วงนี้', w/2, h/2);
    if(lg) lg.textContent=''; return;
  }
  let vmin=Math.min(...vals,m.k==='late'?0:m.tgt), vmax=Math.max(...vals,m.k==='late'?1:m.tgt);
  const padv=(vmax-vmin)*0.18||1; vmin-=padv; vmax+=padv;
  if(m.unit==='%'){ vmin=Math.max(0,vmin); vmax=Math.min(100,vmax+2); }
  const X=i=> dks.length===1? w/2 : PL+(w-PL-PR)*i/(dks.length-1);
  const Y=v=> PT+(h-PT-PB)*(1-(v-vmin)/(vmax-vmin));
  /* grid + แกน */
  x.strokeStyle='#f0ead9'; x.lineWidth=1;
  [0,.5,1].forEach(f=>{ const v=vmin+(vmax-vmin)*f;
    x.beginPath(); x.moveTo(PL,Y(v)); x.lineTo(w-PR,Y(v)); x.stroke();
    x.fillStyle='#c4bca6'; x.font='9.5px Segoe UI'; x.textAlign='right'; x.textBaseline='middle';
    x.fillText(m.unit==='t'? hmOf(v) : (Math.round(v*10)/10), PL-5, Y(v)); });
  /* เส้นเป้า */
  if(m.k!=='late'){
    x.setLineDash([5,4]); x.strokeStyle='#2e7d32'; x.lineWidth=1.5;
    x.beginPath(); x.moveTo(PL,Y(m.tgt)); x.lineTo(w-PR,Y(m.tgt)); x.stroke(); x.setLineDash([]);
    x.fillStyle='#2e7d32'; x.font='700 9.5px Segoe UI'; x.textAlign='left'; x.textBaseline='bottom';
    x.fillText('เป้า', PL+2, Y(m.tgt)-2);
  }
  /* พื้นไล่เฉด (เฉพาะสาขาเดียว) */
  if(series.length===1){
    const s=series[0], pts=s.pts.map((v,i)=>v==null?null:{x:X(i),y:Y(v)}).filter(Boolean);
    if(pts.length>1){
      x.beginPath(); x.moveTo(pts[0].x,h-PB); pts.forEach(p=>x.lineTo(p.x,p.y));
      x.lineTo(pts[pts.length-1].x,h-PB); x.closePath();
      const gr=x.createLinearGradient(0,0,0,h);
      gr.addColorStop(0,s.col+'55'); gr.addColorStop(1,s.col+'05');
      x.fillStyle=gr; x.fill();
    }
  }
  /* เส้นข้อมูล */
  series.forEach(s=>{
    const pts=s.pts.map((v,i)=>v==null?null:{x:X(i),y:Y(v),v});
    x.strokeStyle=s.col; x.lineWidth=series.length===1?2.8:2;
    x.beginPath(); let started=false;
    pts.forEach(p=>{ if(!p){started=false;return;} started? x.lineTo(p.x,p.y):x.moveTo(p.x,p.y); started=true; });
    x.stroke();
    pts.forEach(p=>{ if(!p) return;
      const good = m.k==='late'? p.v===0 : (m.hi? p.v>=m.tgt : p.v<m.tgt);
      x.beginPath(); x.arc(p.x,p.y,series.length===1?4.5:3.5,0,Math.PI*2);
      x.fillStyle='#fff'; x.fill(); x.lineWidth=2.5;
      x.strokeStyle= series.length===1? (good?'#2e7d32':'#D40511') : s.col; x.stroke(); });
    if(series.length===1){
      x.font='700 10px Segoe UI'; x.textAlign='center'; x.textBaseline='bottom';
      pts.forEach(p=>{ if(!p) return;
        const good= m.k==='late'? p.v===0 : (m.hi? p.v>=m.tgt : p.v<m.tgt);
        x.fillStyle= good?'#1c7a4d':'#b3121d'; x.fillText(m.fmt(p.v), p.x, p.y-8); });
    }
  });
  /* แกนวันที่ */
  x.fillStyle='#a09884'; x.font='9.5px Segoe UI'; x.textAlign='center'; x.textBaseline='top';
  dks.forEach((k,i)=>{ const[,mm,dd]=k.split('-');
    x.fillText((k===todayKey()?'วันนี้':(+dd)+'/'+(+mm)), X(i), h-PB+4); });
  /* legend + สรุป */
  if(lg){
    if(series.length===1){
      const v=series[0].pts.filter(p=>p!=null);
      const avg=av(v), last=v[v.length-1];
      lg.innerHTML= v.length? '<b>'+CHDEP+'</b> • เฉลี่ย '+m.fmt(avg)+' • ล่าสุด '+m.fmt(last) : '';
    } else lg.innerHTML=series.map(s=>'<span style="font-weight:700;color:'+s.col+';margin-right:9px;">● '+s.dep+'</span>').join('');
  }
}

window.__open=async (dep,task)=>{
  const d=DATA[dep], p=(d&&d.pph)||{}, cmap={};
  (d&&d.couriers||[]).forEach(c=>cmap[c.id]=c);
  const T=TASKS.find(t=>t.k===task)||{l:task};
  const s=taskState(dep,task);
  let b='<h3>'+dep+' — '+T.l+'</h3><div class="sub">'+thD(DATE)+(T.tg?' • เป้า '+T.tg:'')+(d&&d.by?' • บันทึกโดย '+esc(d.by):'')+'</div>';

  if(!d){ b+='<div class="empty">สาขานี้ยังไม่ส่งข้อมูลวันนี้</div>'; }
  else if(task==='checkin'){
    const rows=Object.entries(d.checkins||{}).map(([cid,r])=>({c:cmap[cid]||{code:cid,name:''},r}))
      .sort((a,b2)=>a.r.ts-b2.r.ts);
    b+= rows.length? rows.map(x=>'<div class="row-c">'
      +'<div class="info"><div class="nm">'+esc(x.c.code)+' <span style="font-weight:400;">'+esc(x.c.name)+'</span></div>'
      +'<div class="sub2">'+esc(x.c.type||'')+' '+esc(x.c.vendor||'')+(x.r.manualEdit?' • แก้เวลา *':'')+(x.r.uniform===false?' • ไม่ใส่ยูนิฟอร์ม':'')+'</div></div>'
      +'<span class="chip '+(x.r.status==='late'?'no':'ok')+'">'+(x.r.status==='late'?'✖ ':'✔ ')+fmtT(x.r.ts)+'</span>'
      +(x.r.hasPhoto?'<img class="thumb" data-ph="ci_'+x.c.id+'_'+DATE+'" data-dep="'+dep+'">':'')
      +'</div>').join('') : '<div class="empty">ยังไม่มีการเช็คอิน</div>';
  }
  else if(task==='pd'){
    b+= p.pd&&p.pd.ts
      ? '<div class="row-c"><div class="info"><div class="nm">ถ่ายเมื่อ '+fmtT(p.pd.ts)+(p.pd.manualEdit?' *':'')+'</div>'
        +'<div class="sub2">เป้า ก่อน 07:15</div></div>'
        +'<span class="chip '+(secOf(p.pd.ts)<=PD_END?'ok':'no')+'">'+(secOf(p.pd.ts)<=PD_END?'✔ ในเวลา':'✖ เกินเวลา')+'</span></div>'
        +(p.pd.hasPhoto? '<img class="photo" data-ph="pd_pd_'+DATE+'" data-dep="'+dep+'">':'<div class="small">ไม่มีรูปบนคลาวด์</div>')
      : '<div class="empty">ยังไม่ได้ถ่าย PD</div>';
  }
  else if(task==='fib'||task==='lib'){
    const ts= task==='fib'? p.inboundTs : p.lastInboundTs;
    b+= ts? '<div class="row-c"><div class="info"><div class="nm">'+(task==='fib'?'First Inbound':'Last Inbound')+' '+fmtT(ts)+'</div>'
        +'<div class="sub2">พัสดุ '+((+p.pNew||0)+(+p.pOld||0))+' ชิ้น • Staff '+(p.staffN||0)+' Sorter '+(p.sorterN||0)+' Courier '+(p.courierN||0)+'</div></div></div>'
      : '<div class="empty">ยังไม่ได้บันทึกเวลานี้</div>';
    if(task==='fib'&&p.inboundTs){
      const fs=Object.values(p.rp||{}).map(x=>x.fs).filter(Boolean);
      if(fs.length) b+='<div class="row-c"><div class="info"><div class="nm">Avg First Scan '+hmOf(av(fs.map(secOf)))+'</div>'
        +'<div class="sub2">กด FS แล้ว '+fs.length+'/'+((+p.courierN)||fs.length)+' คน</div></div></div>';
    }
  }
  else {
    const key= task==='dep'? 'dep':'fdel';
    const rows=Object.entries(p.rp||{}).filter(([,q])=>q[key])
      .map(([cid,q])=>({c:cmap[cid]||{code:cid,name:''},q})).sort((a,b2)=>a.q[key]-b2.q[key]);
    const lim= task==='dep'? T_DEP : T_FDEL;
    b+= rows.length? rows.map(x=>{
      const stem=(x.q.dep&&x.q.fdel&&x.q.fdel>x.q.dep)? Math.round((x.q.fdel-x.q.dep)/60000):null;
      return '<div class="row-c"><div class="info"><div class="nm">'+esc(x.c.code)+' <span style="font-weight:400;">'+esc(x.c.name)+'</span></div>'
        +'<div class="sub2">FS '+(x.q.fs?fmtT(x.q.fs):'—')+' • DEP '+(x.q.dep?fmtT(x.q.dep):'—')
        +(stem!=null?' • Stem '+stem+' น.':'')+'</div></div>'
        +'<span class="chip '+(secOf(x.q[key])<lim?'ok':'no')+'">'+fmtT(x.q[key])+'</span></div>';
    }).join('') : '<div class="empty">ยังไม่มีข้อมูล</div>';
  }

  /* คอมเมนต์ของ Task นี้ */
  const cs=(COM[dep]||[]).filter(c=>c.task===task).sort((a,b2)=>(b2.at||0)-(a.at||0));
  if(cs.length) b+='<div style="margin-top:14px;font-weight:800;font-size:13px;">💬 คอมเมนต์</div>'
    +cs.map(c=>'<div class="cm'+(c.ackAt?' done':'')+'"><div class="t">'+fmtT(c.at||Date.now())+'</div>'
      +'<div class="x">'+esc(c.text)+'</div>'
      +(c.ackAt? '<div class="ok2">✔ สาขารับทราบแล้วโดย '+esc(c.ackBy)+' เวลา '+fmtT(c.ackAt)+'</div>'
               : '<div class="t" style="color:#b3121d;margin-top:4px;">⏳ ยังไม่รับทราบ</div>')+'</div>').join('');

  b+='<div style="margin-top:14px;font-weight:800;font-size:13px;margin-bottom:6px;">✍️ ส่งคอมเมนต์ถึงสาขานี้</div>'
    +'<textarea id="cmTxt" placeholder="พิมพ์ข้อความถึง '+dep+' เรื่อง '+T.l+'..."></textarea>'
    +'<div style="display:flex;gap:8px;margin-top:10px;">'
    +'<button class="btn btn-r" style="flex:1;" onclick="window.__send(\''+dep+'\',\''+task+'\')">📨 ส่งคอมเมนต์</button>'
    +'<button class="btn btn-o" style="flex:1;" onclick="document.getElementById(\'mdl\').classList.remove(\'show\')">ปิด</button></div>';

  document.getElementById('mdlBody').innerHTML=b;
  document.getElementById('mdl').classList.add('show');
  loadPhotos();
};

async function loadPhotos(){
  const els=[...document.querySelectorAll('[data-ph]')];
  for(const el of els){
    try{
      const s=await getDoc(doc(db,'depots',el.dataset.dep,'photos',el.dataset.ph));
      if(s.exists()&&s.data().d) el.src=s.data().d;
      else el.style.display='none';
    }catch(e){ el.style.display='none'; }
  }
}

/* ---------- ⚙️ ตั้งค่า: PIN Manager + PIN สาขา ---------- */
window.__settings=async ()=>{
  let b='<h3>⚙️ ตั้งค่าระบบ</h3><div class="sub">จัดการ PIN และรายชื่อ Staff</div>';
  b+='<div style="font-weight:800;font-size:13.5px;margin-bottom:7px;">🔑 PIN ผู้จัดการ (หน้านี้)</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:16px;">'
    +'<input id="pinMg" type="tel" inputmode="numeric" maxlength="6" placeholder="PIN ใหม่ 4–6 หลัก" '
    +'style="flex:1;padding:12px;border:none;border-radius:14px;background:#f2ede2;font-size:16px;font-weight:700;text-align:center;letter-spacing:3px;font-family:inherit;">'
    +'<button class="btn btn-y" onclick="window.__savePin(\'__manager__\')">บันทึก</button></div>';
  b+='<div style="font-weight:800;font-size:13.5px;margin-bottom:7px;">🏢 PIN ของแต่ละสาขา</div>'
    +'<div class="small" style="margin-bottom:9px;">Staff จะล็อกอินได้เฉพาะชื่อที่เพิ่มไว้ที่นี่เท่านั้น • 🟢 = กำลังออนไลน์ • จำกัดจำนวนเครื่องต่อสาขาได้</div>'
    +'<div id="pinList"><div class="small">กำลังโหลด...</div></div>';
  b+='<div style="display:flex;gap:8px;margin-top:16px;">'
    +'<button class="btn btn-o btn-block" onclick="document.getElementById(\'mdl\').classList.remove(\'show\')">ปิด</button></div>';
  document.getElementById('mdlBody').innerHTML=b;
  document.getElementById('mdl').classList.add('show');

  const rows=[]; const now=Date.now();
  for(const dep of DEPOTS){
    let pin='', staff=[], maxN=(dep==='BPE'?4:3);
    try{ const s=await getDoc(doc(db,'depots',dep));
      if(s.exists()){ pin=s.data().pin||''; staff=s.data().staffNames||[]; maxN=(+s.data().maxStaff)||maxN; } }catch(e){}
    let act=[];
    try{ const ss=await getDocs(collection(db,'depots',dep,'sessions'));
      act=ss.docs.map(x=>({n:x.id,at:x.data().at||0})).filter(x=>now-x.at<6*60*1000).map(x=>x.n); }catch(e){}
    rows.push('<div style="background:#fbf9f4;border-radius:18px;padding:13px;margin-bottom:9px;">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
      +'<b style="font-size:15px;">'+dep+'</b>'
      +(pin?'<span class="chip ok">PIN ตั้งแล้ว</span>':'<span class="chip no">ยังไม่ตั้ง PIN</span>')
      +'<span class="chip" style="background:#ece5d5;color:#5a5140;">'+staff.length+'/'+maxN+' คน</span>'
      +(act.length?'<span class="chip ok">🟢 ออนไลน์ '+act.length+'</span>':'')
      +'<span style="flex:1"></span>'
      +'<input id="pin_'+dep+'" type="tel" inputmode="numeric" maxlength="6" value="'+esc(pin)+'" placeholder="PIN"'
      +' style="width:92px;padding:8px;border:none;border-radius:11px;background:#fff;font-size:14px;font-weight:800;text-align:center;letter-spacing:2px;font-family:inherit;">'
      +'<button class="mini" onclick="window.__savePin(\''+dep+'\')">บันทึก</button></div>'
      +'<div style="margin-top:9px;">'
      + (staff.length? staff.map(n=>'<span style="display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:99px;'
          +'padding:5px 6px 5px 11px;margin:0 5px 5px 0;font-size:12.5px;font-weight:700;">'
          +(act.includes(n)?'🟢 ':'')+esc(n)
          +'<button class="mini" style="background:#fbdfdd;color:#b3261e;padding:2px 7px;font-size:11px;" '
          +'onclick="window.__delStaff(\''+dep+'\',\''+esc(n).replace(/'/g,"\\'")+'\')">✕</button></span>').join('')
        : '<span class="small">ยังไม่มีรายชื่อ — Staff จะล็อกอินไม่ได้จนกว่าจะเพิ่มชื่อ</span>')
      +'</div>'
      +'<div style="display:flex;gap:7px;margin-top:8px;">'
      +'<input id="ns_'+dep+'" placeholder="ชื่อ Staff ใหม่" '+(staff.length>=maxN?'disabled':'')
      +' style="flex:1;padding:9px;border:none;border-radius:11px;background:#fff;font-size:13px;font-family:inherit;'
      +(staff.length>=maxN?'opacity:.45;':'')+'">'
      +'<button class="mini" '+(staff.length>=maxN?'disabled style="opacity:.4;"':'')
      +' onclick="window.__addStaff(\''+dep+'\')">+ เพิ่ม</button>'
      +'<select onchange="window.__setMax(\''+dep+'\',this.value)" style="width:96px;padding:8px;border:none;border-radius:11px;background:#fff;font-size:12px;font-weight:700;font-family:inherit;">'
      + [1,2,3,4,5,6].map(v=>'<option value="'+v+'"'+(v===maxN?' selected':'')+'>สูงสุด '+v+'</option>').join('')
      +'</select></div></div>');
  }
  const el=document.getElementById('pinList'); if(el) el.innerHTML=rows.join('');
};
window.__addStaff=async dep=>{
  const inp=document.getElementById('ns_'+dep), v=(inp.value||'').trim();
  if(!v){ return; }
  try{
    const s=await getDoc(doc(db,'depots',dep));
    const cur=(s.exists()&&s.data().staffNames)||[];
    const maxN=(s.exists()&&+s.data().maxStaff)||(dep==='BPE'?4:3);
    if(cur.includes(v)){ alert('มีชื่อนี้อยู่แล้ว'); return; }
    if(cur.length>=maxN){ alert('สาขา '+dep+' ครบ '+maxN+' คนแล้ว — ลบชื่อเดิมก่อนหรือเพิ่มจำนวนสูงสุด'); return; }
    await setDoc(doc(db,'depots',dep),{depot:dep, staffNames:[...cur,v]},{merge:true});
    window.__settings();
  }catch(e){ alert('เพิ่มไม่สำเร็จ: '+e.message); }
};
window.__delStaff=async (dep,name)=>{
  if(!confirm('ลบ "'+name+'" ออกจากสาขา '+dep+'?\nเครื่องที่ล็อกอินด้วยชื่อนี้จะใช้งานต่อไม่ได้')) return;
  try{
    const s=await getDoc(doc(db,'depots',dep));
    const cur=(s.exists()&&s.data().staffNames)||[];
    await setDoc(doc(db,'depots',dep),{staffNames:cur.filter(x=>x!==name)},{merge:true});
    try{ await deleteDoc(doc(db,'depots',dep,'sessions',name)); }catch(e){}
    window.__settings();
  }catch(e){ alert('ลบไม่สำเร็จ: '+e.message); }
};
window.__setMax=async (dep,v)=>{
  try{ await setDoc(doc(db,'depots',dep),{depot:dep, maxStaff:+v},{merge:true}); window.__settings(); }
  catch(e){ alert('บันทึกไม่สำเร็จ'); }
};
window.__savePin=async dep=>{
  const isMg = dep==='__manager__';
  const inp=document.getElementById(isMg? 'pinMg':'pin_'+dep);
  const v=(inp.value||'').trim();
  if(!/^\d{4,6}$/.test(v)){ alert('PIN ต้องเป็นตัวเลข 4–6 หลัก'); return; }
  try{
    if(isMg){
      await setDoc(doc(db,'config','manager'),{pin:v, updatedAt:Date.now()},{merge:true});
      try{ localStorage.setItem('mgPin',v); }catch(e){}
      alert('✔ เปลี่ยน PIN ผู้จัดการเป็น '+v+' แล้ว');
    } else {
      await setDoc(doc(db,'depots',dep),{depot:dep, pin:v, updatedAt:Date.now()},{merge:true});
      alert('✔ ตั้ง PIN ของสาขา '+dep+' = '+v+' แล้ว');
      window.__settings();
    }
  }catch(e){ alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__send=async (dep,task)=>{
  const t=document.getElementById('cmTxt').value.trim();
  if(!t) return;
  try{
    await addDoc(collection(db,'depots',dep,'comments'),
      { task, date:DATE, text:t, at:Date.now(), by:'Manager', ackAt:null, ackBy:null });
    document.getElementById('mdl').classList.remove('show');
  }catch(e){ alert('ส่งไม่สำเร็จ: '+e.message); }
};

document.getElementById('mdl').addEventListener('click',e=>{
  if(e.target.id==='mdl') e.currentTarget.classList.remove('show');
});

setInterval(()=>{ const d=new Date();
  document.getElementById('clk').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  const k=todayKey(); if(k!==DATE){ DATE=k; start(); }
},1000);

signInAnonymously(auth).catch(e=>console.warn(e));
onAuthStateChanged(auth,u=>{
  if(!u) return;
  const saved=(()=>{try{return localStorage.getItem('mgPin');}catch(e){return null;}})();
  if(saved){ document.getElementById('mgPin').value=saved; login(); }
});
