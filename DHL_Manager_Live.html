<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DHL Manager Live</title>
<style>
:root{--y:#FFCC00;--r:#D40511;--k:#1a1a1a;--g:#2e7d32;--am:#b58900;--muted:#a09884;--bg:#f7f4ee;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI','Noto Sans Thai',Tahoma,sans-serif;background:var(--bg);min-height:100vh;color:var(--k);padding-bottom:40px;-webkit-font-smoothing:antialiased;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}
.topbar{position:sticky;top:0;z-index:50;background:rgba(247,244,238,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
.ybar{height:6px;background:linear-gradient(90deg,#FFCC00,#ffb700);}
.hd{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;}
.mlogo{font-size:22px;font-weight:900;font-style:italic;} .mlogo span{color:var(--r);}
.live{font-size:10.5px;font-weight:800;color:var(--g);display:flex;align-items:center;gap:5px;justify-content:flex-end;}
.live i{width:8px;height:8px;border-radius:50%;background:var(--g);animation:blink 1.6s infinite;font-style:normal;}
.hd .meta{text-align:right;font-size:11px;color:var(--muted);}
.wrap{max-width:900px;margin:0 auto;padding:12px;}
.card{background:#fff;border-radius:22px;box-shadow:0 1px 6px rgba(60,50,20,.07);padding:15px;margin-bottom:11px;animation:fadeUp .3s ease;}
h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.small{font-size:11.5px;color:var(--muted);}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:11px;}
@media(max-width:620px){ .kpis{grid-template-columns:repeat(3,1fr);gap:6px;} }
.kpi{background:#fff;border-radius:18px;padding:11px;box-shadow:0 1px 5px rgba(60,50,20,.06);position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:#e9e2d2;}
.kpi.red::before{background:var(--r);} .kpi.green::before{background:var(--g);} .kpi.am::before{background:var(--y);}
.kpi .v{font-size:23px;font-weight:800;line-height:1;} .kpi .l{font-size:10px;color:#8a8272;font-weight:600;margin-top:3px;}
/* ตารางพอดีจอเสมอ — ไม่ต้องเลื่อนซ้าย-ขวา */
.gridwrap{margin:0 -2px;padding:0 2px;overflow:visible;}
table.grid{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:3px;font-size:12px;}
table.grid col.c-dep{width:15%;} table.grid col.c-task{width:14.16%;}
table.grid th{font-size:9.5px;color:#8a8272;font-weight:800;letter-spacing:.2px;padding:2px 1px;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
table.grid th .tg{color:var(--r);font-size:8px;display:block;font-weight:700;margin-top:1px;}
td.dep{font-weight:900;font-size:13.5px;text-align:left;padding-right:4px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.25;}
td.dep small{display:block;font-size:9px;color:#a09884;font-weight:600;}
td.cell{border-radius:12px;text-align:center;padding:8px 2px;cursor:pointer;background:#f2ede2;color:#b0a892;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1);overflow:hidden;}
td.cell:active{transform:scale(.93);}
td.cell b{display:block;font-size:13.5px;font-weight:800;line-height:1.15;white-space:nowrap;}
td.cell span{font-size:8.5px;font-weight:700;opacity:.85;display:block;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
@media(max-width:560px){
  table.grid{border-spacing:2px;}
  table.grid col.c-dep{width:16%;}
  table.grid th{font-size:8px;} table.grid th .tg{font-size:7px;}
  td.dep{font-size:12px;} td.dep small{font-size:8px;}
  td.cell{padding:7px 1px;border-radius:10px;}
  td.cell b{font-size:11.5px;} td.cell span{display:none;}
}
td.cell.ok{background:#e6f5eb;color:#1c7a4d;} td.cell.bad{background:#fdeaea;color:#b3121d;}
td.cell.wait{background:#fff6d6;color:#8a6d00;}
td.cell.hascom{box-shadow:inset 0 0 0 2.5px var(--r);}
.dot{position:absolute;} .cellwrap{position:relative;}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:#8a8272;margin-top:9px;font-weight:600;}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;vertical-align:-1px;margin-right:4px;font-style:normal;}
.btn{border:none;border-radius:99px;padding:12px 15px;font-size:13.5px;font-weight:800;cursor:pointer;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);font-family:inherit;}
.btn:active{transform:scale(.93);}
.btn-y{background:#1a1a1a;color:var(--y);} .btn-o{background:#f2ede2;color:#5a5140;}
.btn-r{background:linear-gradient(135deg,#e6212e,#D40511);color:#fff;} .btn-block{width:100%;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;align-items:flex-end;justify-content:center;}
.modal.show{display:flex;}
.sheet{background:#fff;border-radius:26px 26px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:20px;animation:fadeUp .28s ease;}
.sheet h3{font-size:18px;margin-bottom:3px;} .sheet .sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
.row-c{display:flex;align-items:center;gap:10px;background:#fbf9f4;border-radius:16px;padding:9px 12px;margin-bottom:6px;}
.row-c .info{flex:1;min-width:0;} .row-c .nm{font-weight:700;font-size:13px;}
.row-c .sub2{font-size:10.5px;color:#a09884;}
.chip{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;white-space:nowrap;}
.chip.ok{background:#dff3e6;color:#1c7a4d;} .chip.no{background:#fbdfdd;color:#b3261e;}
textarea{width:100%;border:none;background:#f2ede2;border-radius:16px;padding:13px;font-size:14px;
  font-family:inherit;min-height:88px;resize:vertical;color:#3a3428;}
textarea:focus{outline:2px solid var(--y);}
.cm{background:#fff8d9;border-radius:15px;padding:12px;margin-bottom:8px;}
.cm.done{background:#f3faf5;} .cm .t{font-size:10.5px;color:#a09884;font-weight:700;margin-bottom:3px;}
.cm .x{font-size:13.5px;line-height:1.5;} .cm .ok2{font-size:11px;color:#1c7a4d;font-weight:800;margin-top:5px;}
.photo{width:100%;border-radius:14px;margin-top:8px;}
.thumb{width:52px;height:52px;border-radius:11px;object-fit:cover;background:#eee;flex-shrink:0;}
#login{position:fixed;inset:0;z-index:9999;background:linear-gradient(165deg,#1a1a1a,#2a2a2a);display:flex;align-items:center;justify-content:center;padding:24px;}
#login .box{background:#fff;border-radius:28px;padding:26px 22px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);}
#login h3{font-size:21px;font-weight:800;margin-bottom:3px;} #login p{font-size:12.5px;color:#a09884;margin-bottom:16px;}
#login input{width:100%;padding:13px;border:none;border-radius:14px;background:#f2ede2;font-size:22px;
  letter-spacing:6px;text-align:center;font-weight:700;margin-bottom:12px;font-family:inherit;}
#login .yb{height:5px;background:linear-gradient(90deg,#FFCC00,#ffb700);border-radius:99px;margin-bottom:16px;}
#login .err{color:var(--r);font-size:12.5px;font-weight:700;min-height:18px;margin-bottom:6px;}
.empty{text-align:center;color:#b0a892;padding:40px 10px;font-size:13px;}
.mtabs{display:flex;gap:5px;background:#fff;border-radius:99px;padding:5px;box-shadow:0 1px 6px rgba(60,50,20,.08);margin-bottom:11px;}
.mtab{flex:1;border:none;border-radius:99px;padding:11px 4px;font-weight:800;font-size:13px;background:none;color:#a09884;
  cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);font-family:inherit;}
.mtab.on{background:#1a1a1a;color:var(--y);transform:scale(1.03);}
.iss{display:flex;gap:11px;align-items:flex-start;border-radius:16px;padding:12px 13px;margin-bottom:8px;background:#fbf9f4;cursor:pointer;transition:transform .16s;}
.iss:active{transform:scale(.99);}
.iss.crit{background:#fff1f0;box-shadow:inset 3.5px 0 0 var(--r);}
.iss.warn{background:#fff8e0;box-shadow:inset 3.5px 0 0 var(--y);}
.iss .ic{font-size:20px;line-height:1;flex-shrink:0;margin-top:1px;}
.iss .bd{flex:1;min-width:0;} .iss .ti{font-weight:800;font-size:13.5px;}
.iss .de{font-size:11.5px;color:#8a8272;margin-top:2px;line-height:1.45;}
.iss .go{font-size:11px;font-weight:800;color:var(--r);white-space:nowrap;align-self:center;}
.stepgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;}
.stepcard{background:#fbf9f4;border-radius:16px;padding:12px;cursor:pointer;}
.stepcard .h{font-weight:800;font-size:12.5px;margin-bottom:3px;}
.stepcard .n{font-size:21px;font-weight:800;line-height:1.1;}
.stepcard .s{font-size:10.5px;color:#8a8272;font-weight:600;margin-top:2px;}
.stepbar{display:flex;gap:3px;margin-top:8px;}
.stepbar i{flex:1;height:7px;border-radius:99px;background:#ece5d5;font-style:normal;}
.stepbar i.ok{background:var(--g);} .stepbar i.bad{background:var(--r);} .stepbar i.wait{background:var(--y);}
/* ---- แจ้งเตือน ---- */
#notiBtn{position:fixed;right:12px;bottom:14px;z-index:70;border:none;border-radius:99px;padding:12px 16px;
  font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;background:#1a1a1a;color:var(--y);
  box-shadow:0 5px 18px rgba(0,0,0,.3);transition:transform .18s cubic-bezier(.34,1.56,.64,1);}
#notiBtn:active{transform:scale(.92);}
#notiBtn.off{background:#f2ede2;color:#8a8272;}
#notiBtn.warn{background:#fff3d6;color:#a06a00;}
#feed{position:fixed;left:0;right:0;bottom:0;z-index:69;pointer-events:none;padding:0 12px 74px;
  display:flex;flex-direction:column;align-items:center;gap:7px;}
.fitem{pointer-events:auto;background:#1a1a1a;color:#fff;border-radius:16px;padding:11px 15px;max-width:420px;width:100%;
  box-shadow:0 8px 26px rgba(0,0,0,.35);animation:fUp .35s cubic-bezier(.34,1.56,.64,1);font-size:13.5px;
  display:flex;gap:10px;align-items:center;}
@keyframes fUp{from{opacity:0;transform:translateY(22px) scale(.96);}to{opacity:1;transform:none;}}
.fitem b{color:var(--y);} .fitem.ok b{color:#7fe0a8;} .fitem.bad b{color:#ff9a92;}
.fitem .ic{font-size:20px;flex-shrink:0;}
.fitem .tx{flex:1;line-height:1.4;} .fitem .tx small{display:block;color:#a09884;font-size:11px;margin-top:1px;}
.fitem.done{background:linear-gradient(135deg,#1c7a4d,#2e7d32);}
.fitem.done b{color:#fff;}
/* ---- 🛡 แถบเตือนสุขภาพระบบ ---- */
.hbar{background:linear-gradient(135deg,#D40511,#a00d16);color:#fff;border-radius:16px;padding:12px 15px;
  margin-bottom:11px;cursor:pointer;box-shadow:0 4px 16px rgba(212,5,17,.28);
  animation:fadeUp .3s ease;-webkit-tap-highlight-color:transparent;}
.hbar:active{transform:scale(.985);}
.hbar b{display:block;font-size:14px;font-weight:900;}
.hbar span{display:block;font-size:11.5px;opacity:.9;margin-top:3px;font-weight:600;line-height:1.5;}
/* ---- 📣 ฟอร์มส่งประกาศ ---- */
.lab2{font-size:11px;font-weight:800;color:#8a8272;margin:12px 0 5px;letter-spacing:.3px;}
.nrow{display:flex;gap:5px;align-items:center;margin-bottom:6px;}
.nrow input[type=checkbox]{width:19px;height:19px;min-height:0;flex-shrink:0;accent-color:#D40511;}
.nrow .nk{flex:2.1;min-width:0;} .nrow .nv{flex:1.1;min-width:0;} .nrow .nt{flex:1.2;min-width:0;}
.nrow input{margin:0;padding:8px 9px;font-size:13px;min-height:38px;}
/* ---- 🟢 ON AIR (ใครกำลังใช้แอปอยู่) ---- */
.onair{display:block;font-size:8.5px;font-weight:800;color:#12683f;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.onair i{width:6px;height:6px;border-radius:50%;background:#1c7a4d;font-style:normal;
  display:inline-block;margin-right:4px;vertical-align:1px;animation:blip 1.3s ease-in-out infinite;}
@keyframes blip{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(28,122,77,.55);}
  50%{opacity:.4;box-shadow:0 0 0 4px rgba(28,122,77,0);}}
.offair{display:block;font-size:8.5px;font-weight:700;color:#c4bca6;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.offair i{width:6px;height:6px;border-radius:50%;border:1.5px solid #d5cdb9;font-style:normal;
  display:inline-block;margin-right:4px;vertical-align:1px;box-sizing:border-box;}
.onair,.offair{cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:opacity .15s;} .onair:active,.offair:active{opacity:.5;}
@media(max-width:560px){ .onair,.offair{font-size:7.5px;} }
.dotlive{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1c7a4d;
  margin-right:6px;vertical-align:3px;animation:blip 1.3s ease-in-out infinite;}
/* ---- 📋 DATA TAB ---- */
.segbar{display:flex;gap:3px;background:#f2ede2;border-radius:12px;padding:3px;margin-bottom:10px;}
.seg{flex:1;border:none;border-radius:9px;padding:8px 4px;font-weight:800;font-size:12px;background:none;color:#8a8272;
  font-family:inherit;cursor:pointer;transition:.16s;-webkit-tap-highlight-color:transparent;}
.seg:active{transform:scale(.97);}
.seg.on{background:#fff;color:#1a1a1a;box-shadow:0 1px 4px rgba(60,50,20,.14);}
.dtbl{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:12.5px;}
.dtbl th{font-size:9.5px;color:#a09884;text-transform:uppercase;letter-spacing:.4px;font-weight:800;
  padding:0 7px 4px;text-align:center;white-space:nowrap;position:sticky;top:0;background:#fff;z-index:2;}
.dtbl th.l,.dtbl td.l{text-align:left;}
.dtbl td{padding:9px 7px;text-align:center;background:#fbf9f4;white-space:nowrap;font-weight:700;}
.dtbl td:first-child{border-radius:14px 0 0 14px;} .dtbl td:last-child{border-radius:0 14px 14px 0;}
.dtbl td.g{background:#e6f5eb;color:#12683f;} .dtbl td.b{background:#fdeaea;color:#b3121d;}
.dtbl td.n{color:#c4bca6;font-weight:600;}
.dtbl .nm{font-weight:800;} .dtbl .s2{font-size:10px;color:#8a8272;font-weight:600;}
.dtbl tr.sep td{background:none;padding:2px;}
.dwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px;max-height:70vh;overflow-y:auto;}
.impcard{display:flex;align-items:center;gap:11px;background:#fbf9f4;border-radius:18px;padding:12px 14px;margin-bottom:7px;
  cursor:pointer;transition:.18s;} .impcard:active{transform:scale(.985);}
.impcard.up{background:linear-gradient(135deg,#e6f5eb,#f3faf5);} .impcard.dn{background:linear-gradient(135deg,#fdeaea,#fff5f5);}
.impcard .dp{font-weight:900;font-size:16px;width:52px;flex-shrink:0;}
.impcard .bd{flex:1;min-width:0;} .impcard .t1{font-weight:800;font-size:12.5px;}
.impcard .t2{font-size:10.5px;color:#8a8272;font-weight:600;margin-top:2px;}
.impcard .pc{font-size:20px;font-weight:900;white-space:nowrap;}
.impcard .pc.up{color:#12683f;} .impcard .pc.dn{color:#b3121d;} .impcard .pc.eq{color:#a09884;}
.dlg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:#8a8272;font-weight:700;margin-top:9px;align-items:center;}
.dlg i{width:13px;height:13px;border-radius:4px;display:inline-block;margin-right:4px;vertical-align:-2px;font-style:normal;}
.cmpsel{display:flex;gap:5px;margin-top:8px;}
.cmpsel button{flex:1;border:1px solid #efe9dc;border-radius:10px;padding:7px 6px;font-weight:800;font-size:11.5px;
  font-family:inherit;cursor:pointer;background:#fbf9f4;color:#8a8272;transition:.16s;
  -webkit-tap-highlight-color:transparent;}
.cmpsel button:active{transform:scale(.96);}
.cmpsel button.on{background:#1a1a1a;color:var(--y);border-color:#1a1a1a;}
/* ---- ตัวเลือกช่วงวัน + ปุ่มสาขา (ดีไซน์ใหม่) ---- */
.rangebar{background:#fff;border:1px solid #efe9dc;border-radius:16px;padding:11px 12px;margin-bottom:10px;
  box-shadow:0 1px 5px rgba(60,50,20,.05);color:#1a1a1a;animation:fadeUp .25s ease;}
.rangebar .lab{font-size:9.5px;font-weight:800;color:#b0a892;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px;}
.dfield{flex:1;min-width:0;}
.dfield input{width:100%;padding:7px 9px;border:1px solid #ece5d5;border-radius:10px;background:#fbf9f4;
  color:#1a1a1a;font-size:13px;font-weight:700;font-family:inherit;-webkit-appearance:none;min-height:0;}
.dfield input::-webkit-calendar-picker-indicator{opacity:.45;cursor:pointer;width:15px;}
.dfield input:focus{outline:none;border-color:var(--y);background:#fffdf5;box-shadow:0 0 0 3px rgba(255,204,0,.18);}
.dsep{align-self:flex-end;padding-bottom:7px;color:#c4bca6;font-weight:800;font-size:12px;}
.quick{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;}
.qbtn{border:1px solid #efe9dc;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;
  font-family:inherit;background:#fbf9f4;color:#8a8272;transition:all .16s ease;
  -webkit-tap-highlight-color:transparent;}
.qbtn:active{transform:scale(.94);}
.qbtn.on{background:#1a1a1a;color:var(--y);border-color:#1a1a1a;}
.rsum{margin-top:8px;font-size:11px;color:#a09884;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;}
.rsum b{color:#1a1a1a;font-weight:800;}
.depbar{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid #f2ede2;}
.dbtn{border:1px solid #efe9dc;border-radius:8px;padding:5px 10px 5px 8px;font-size:11.5px;font-weight:800;
  cursor:pointer;font-family:inherit;background:#fbf9f4;color:#8a8272;display:inline-flex;align-items:center;gap:5px;
  transition:all .16s ease;-webkit-tap-highlight-color:transparent;}
.dbtn:active{transform:scale(.94);}
.dbtn i{width:7px;height:7px;border-radius:50%;font-style:normal;flex-shrink:0;opacity:.75;}
.dbtn.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.dbtn.on i{opacity:1;}
.dbtn.all.on{background:var(--y);color:#1a1a1a;border-color:var(--y);}
/* ---- ฟอร์ม: input / select ให้เข้าธีม ---- */
#mdlBody select,#mdlBody input[type=text],#mdlBody input:not([type]),#mdlBody textarea{
  width:100%;padding:9px 11px;border:1px solid #ece5d5;border-radius:11px;background:#fbf9f4;
  font-family:inherit;font-size:14px;font-weight:600;color:#1a1a1a;min-height:0;-webkit-appearance:none;}
#mdlBody select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7'><path d='M1 1l4.5 4.5L10 1' stroke='%23a09884' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}
#mdlBody input:focus,#mdlBody select:focus,#mdlBody textarea:focus{
  outline:none;border-color:var(--y);background:#fffdf5;box-shadow:0 0 0 3px rgba(255,204,0,.18);}
</style>
</head>
<body>

<div id="login"><div class="box"><div class="yb"></div>
  <h3>DHL Manager</h3><p>ใส่ PIN ผู้จัดการ — จะเห็นเฉพาะสาขาในความดูแลของ PIN นั้น</p>
  <input id="mgPin" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••">
  <div class="err" id="mgErr"></div>
  <button class="btn btn-y btn-block" id="mgGo">เข้าใช้งาน</button>
</div></div>

<div class="topbar"><div class="ybar"></div>
  <div class="hd">

/* ---------- คำนวณสถานะแต่ละ Task ---------- */
function taskState(dep,k){
  const d=DATA[dep];
  if(!d) return {st:'none'};
  const ck=Object.values(d.checkins||{}), p=d.pph||{};
  const rp=Object.values(p.rp||{});
  if(k==='checkin'){
    if(!ck.length) return {st:'none'};
    const late=ck.filter(r=>r.status==='late').length;
    const abN=Object.keys(d.absent||{}).length;
    return {st: late? 'bad':'ok', v:(ck.length-late)+'/'+ck.length, s2: (late? late+' สาย':'ตรงเวลา')+(abN? ' • ไม่มา '+abN:'')};
  }
  if(k==='pd'){
    const ts=p.pd&&p.pd.ts;
    if(!ts) return {st: ck.length?'wait':'none'};
    return {st: secOf(ts)<=PD_END?'ok':'bad', v:fmtT(ts), s2:'PD'};
  }
  if(k==='fib'){
    if(!p.inboundTs) return {st: ck.length?'wait':'none'};
    return {st:'ok', v:fmtT(p.inboundTs), s2:'First IB'};
  }
  if(k==='lib'){
    if(!p.lastInboundTs) return {st: p.inboundTs?'wait':'none'};
    return {st:'ok', v:fmtT(p.lastInboundTs), s2:'Last IB'};
  }
  if(k==='dep'){
    const deps=rp.map(x=>x.dep).filter(Boolean);
    if(!deps.length) return {st: p.inboundTs?'wait':'none'};
    const a=av(deps.map(secOf));
    const done=deps.length, tot=(+p.courierN)||ck.length||done;
    return {st: done<tot? 'wait' : (a<T_DEP?'ok':'bad'), v:hmOf(a), s2:done+'/'+tot+' คน'};
  }
  if(k==='fdel'){
    const fd=rp.map(x=>x.fdel).filter(Boolean);
    if(!fd.length) return {st: rp.some(x=>x.dep)?'wait':'none'};
    const a=av(fd.map(secOf));
    const done=fd.length, tot=(+p.courierN)||ck.length||done;
    return {st: done<tot? 'wait' : (a<T_FDEL?'ok':'bad'), v:hmOf(a), s2:done+'/'+tot+' คน'};
  }
  return {st:'none'};
}

function notiPerm(){ try{ return ('Notification' in window)? Notification.permission : 'na'; }catch(e){ return 'na'; } }
function updNotiBtn(){
  const b=document.getElementById('notiBtn'); if(!b) return;
  const perm=notiPerm();
  if(!notiOn){ b.className='off'; b.textContent='🔕 เปิดแจ้งเตือน'; return; }

function ding(kind){
  if(!notiOn) return;
  try{
    const C=new (window.AudioContext||window.webkitAudioContext)();
    const seq = kind===2? [[523,0],[659,.12],[784,.24],[1046,.36]] : [[784,0],[1046,.14]];
    seq.forEach(([f,t])=>{
      const o=C.createOscillator(), g=C.createGain();
      o.connect(g); g.connect(C.destination); o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.001,C.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.3,C.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,C.currentTime+t+0.16);
      o.start(C.currentTime+t); o.stop(C.currentTime+t+0.18);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(kind===2?[90,50,90,50,140]:[70]);
}
function toastFeed(ic,html,cls){
  const f=document.getElementById('feed'); if(!f) return;
  const d=document.createElement('div');
  d.className='fitem '+(cls||'');
  d.innerHTML='<div class="ic">'+ic+'</div><div class="tx">'+html+'</div>';
  d.onclick=()=>d.remove();
  f.appendChild(d);
  while(f.children.length>4) f.removeChild(f.firstChild);
  setTimeout(()=>{ d.style.transition='opacity .4s,transform .4s'; d.style.opacity='0';
    d.style.transform='translateY(12px)'; setTimeout(()=>d.remove(),400); }, cls==='done'?12000:7000);
}
function pushNoti(title,body,tag){

const TASK_ICON={checkin:'✅',pd:'📸',fib:'📥',lib:'📦',dep:'🚚',fdel:'🎯'};
window.__PREV=PREV;
/* ปุ่มทดสอบ: กดค้างที่ปุ่มแจ้งเตือน 1 วิ = ยิงแจ้งเตือนตัวอย่าง */

  pushNoti('🔔 ทดสอบแจ้งเตือน','ระบบแจ้งเตือนทำงานปกติ','test');
  ding(1);
  return notiPerm();
};
/* ตรวจว่ามี Task ไหน "เพิ่งเสร็จ" แล้วแจ้ง */
function checkDone(){
  window.__cdRuns=(window.__cdRuns||0)+1;
  DEPOTS.forEach(dep=>{
    if(!DATA[dep]) return;
    let doneCount=0;
    TASKS.forEach(t=>{
      const s=taskState(dep,t.k);
      const key=dep+'|'+t.k;
      const now = s.st==='ok'||s.st==='bad' ? (s.st+'|'+(s.v||'')) : '';
      if(s.st==='ok'||s.st==='bad') doneCount++;
      if(PREV[key]===undefined){ PREV[key]=now; return; }   // ครั้งแรก = ตั้งค่าเริ่มต้น ไม่แจ้ง
      if(now && now!==PREV[key]){
        PREV[key]=now;
        const good = s.st==='ok';
        const ic=TASK_ICON[t.k]||'📌';
        toastFeed(ic, '<b>'+dep+'</b> — '+t.l+' '+(good?'เสร็จแล้ว':'เกินเป้า')
          +'<small>'+(s.v||'')+' • '+(s.s2||'')+(t.tg?' • เป้า '+t.tg:'')+'</small>', good?'ok':'bad');
        pushNoti((good?'✅ ':'⚠️ ')+dep+' — '+t.l,
          (s.v||'')+(s.s2? ' • '+s.s2:'')+(good?'':' (เกินเป้า '+t.tg+')'), dep+t.k);
        ding(1);
      } else PREV[key]=now;
    });
    /* ครบทุกขั้น = สรุปสาขา */
    const fkey=dep+'|__all';
    const allDone = doneCount===TASKS.length;
    if(PREV[fkey]===undefined){ PREV[fkey]=allDone; return; }
    if(allDone && !PREV[fkey]){
      PREV[fkey]=true;
      const d=DATA[dep], ck=Object.values(d.checkins||{}), p=d.pph||{};
      const late=ck.filter(r=>r.status==='late').length;
      const nC=(+p.courierN)||ck.length||0;
      const P=pphOf(p,nC);
      const fd=Object.values(p.rp||{}).map(x=>x.fdel).filter(Boolean);
      const avgF=fd.length? hmOf(av(fd.map(secOf))):'—';
      const sum='Ontime '+(ck.length-late)+'/'+ck.length
        +' • PPH Sort '+(P.sort!=null?Math.round(P.sort*10)/10:'—')
        +' / Route '+(P.route!=null?Math.round(P.route):'—')
        +' • First Del '+avgF;
      toastFeed('🎉','<b>'+dep+' ทำครบทุกขั้นแล้ว</b><small>'+sum+'</small>','done');
      pushNoti('🎉 '+dep+' ทำครบทุกขั้นแล้ว', sum, dep+'_all');
      ding(2);
    } else PREV[fkey]=allDone;
  });
}

/* ---------- RENDER ---------- */
function render(){
  document.getElementById('dTitle').textContent = DATE===todayKey()? 'วันนี้ '+thD(DATE) : thD(DATE);
  const live=DEPOTS.filter(d=>DATA[d]).length;
  document.getElementById('dSub').textContent = '• มีข้อมูล '+live+'/'+DEPOTS.length+' สาขา';

  /* KPI */
  let on=0,late=0,pdOk=0,pdAll=0,fdOk=0,fdAll=0,comOpen=0;
  DEPOTS.forEach(dep=>{
    const d=DATA[dep]; if(d){
      Object.values(d.checkins||{}).forEach(r=> r.status==='late'? late++ : on++);
      const p=d.pph||{};
      if(p.pd&&p.pd.ts){ pdAll++; if(secOf(p.pd.ts)<=PD_END) pdOk++; }
      const fd=Object.values(p.rp||{}).map(x=>x.fdel).filter(Boolean);
      if(fd.length){ fdAll++; if(av(fd.map(secOf))<T_FDEL) fdOk++; }
    }
    comOpen += (COM[dep]||[]).filter(c=>!c.ackAt).length;
  });

  /* GRID */
  let h='<colgroup><col class="c-dep">'+TASKS.map(()=>'<col class="c-task">').join('')+'</colgroup>'

  DEPOTS.forEach(dep=>{

    const n=d? Object.keys(d.checkins||{}).length : 0;
    const onl=onlineOf(dep);
    const last=(SES[dep]||[]).slice().sort((a,b)=>b.at-a.at)[0];
    const click=' onclick="event.stopPropagation();window.__who(\''+dep+'\')" ';
    const air = onl.length
      ? '<span class="onair"'+click+'title="แตะเพื่อดูรายละเอียด"><i></i>Online · '
        + esc(onl.map(s=>s.name).join(', ')) + (onl.length>1? ' ('+onl.length+')':'') + '</span>'
      : '<span class="offair"'+click+'title="แตะเพื่อดูรายละเอียด"><i></i>'
        + (last&&last.at? esc(last.name)+' · '+agoTxt(Date.now()-last.at) : 'ยังไม่เข้าใช้') + '</span>';
    h+='<tr><td class="dep">'+dep+'<small>'+(d? n+' คน':'ไม่มีข้อมูล')+'</small>'+air+'</td>';

  DEPOTS.forEach(dep=>(COM[dep]||[]).forEach(c=>{ if(!c.ackAt) open.push({dep,...c}); }));

    ? '<div class="card"><h2>💬 คอมเมนต์ที่รอสาขารับทราบ</h2>'
      +open.sort((a,b)=>(b.at||0)-(a.at||0)).map(c=>
        '<div class="cm"><div class="t">'+esc(c.dep)+' • '+(TASKS.find(t=>t.k===c.task)||{l:c.task}).l+' • '+fmtT(c.at||Date.now())+'</div>'

    : '';
  if(MTAB==='ins') renderIns();
  if(MTAB==='ch') renderCh();

function nowSec(){ const d=new Date(); return d.getHours()*3600+d.getMinutes()*60; }
function pphOf(p,n){
  const totalP=(+p.pNew||0)+(+p.pOld||0), people=(+p.staffN||0)+(+p.sorterN||0)+(+p.courierN||0);
  const rps=Object.values(p.rp||{}), fs=rps.filter(x=>x.fs).map(x=>x.fs);
  let sort=null,route=null;
  if(p.inboundTs&&n>0&&fs.length>=n&&people>0){
    const avgFs=av(fs); if(avgFs>p.inboundTs){ const hrs=(avgFs-p.inboundTs)/3600000; sort=totalP/(people*hrs); }
  }
  const pr=rps.filter(x=>x.fs&&x.dep&&x.dep>x.fs);
  if(pr.length){ const mh=pr.reduce((a,x)=>a+(x.dep-x.fs),0)/3600000; if(mh>0) route=totalP/mh; }
  return {sort,route,totalP,people};
}

/* กติกาตรวจปัญหา — คืน array ของ issue */
function findIssues(){
  const out=[], t=nowSec(), isToday = DATE===todayKey();
  DEPOTS.forEach(dep=>{
    const d=DATA[dep];
    if(!d){
      if(!isToday||t>=7*3600+30*60)
        out.push({dep,task:'checkin',lv:'crit',ic:'📵',ti:dep+' ยังไม่ส่งข้อมูลเลย',
          de:'ไม่พบการเช็คอินหรือบันทึกใดๆ ของวันนี้ — ตรวจว่าสาขาเปิดแอปและล็อกอินแล้วหรือยัง'});
      return;
    }
    const ck=Object.values(d.checkins||{}), p=d.pph||{}, rp=Object.values(p.rp||{});
    const nC=(+p.courierN)||ck.length||0;

    /* 1) เช็คอิน */
    const lateArr=Object.entries(d.checkins||{}).filter(([,r])=>r.status==='late');
    if(lateArr.length){
      const mins=lateArr.map(([,r])=>Math.max(1,Math.round((secOf(r.ts)-CUT)/60)));
      const worst=Math.max(...mins), sum=mins.reduce((a,b)=>a+b,0);
      out.push({dep,task:'checkin',lv:lateArr.length>=3?'crit':'warn',ic:'⏰',
        ti:dep+' มาสาย '+lateArr.length+' คน',
        de:'รวม '+sum+' นาที • สายสุด '+worst+' นาที — แตะดูรายชื่อและส่งคอมเมนต์'});
    }
    const abs=Object.entries(d.absent||{});
    if(abs.length>=3) out.push({dep,task:'checkin',lv:'warn',ic:'🚫',ti:dep+' ไม่มาทำงาน '+abs.length+' คน',
      de:abs.map(([,r])=>r.note||'ไม่ระบุ').slice(0,3).join(' / ')+' — ตรวจกำลังพลว่าพอวิ่งงานหรือไม่'});
    /* ตรวจความถูกต้องของชุดข้อมูล */
    if(p.courierN && ck.length && Math.abs((+p.courierN)-ck.length)>3)
      out.push({dep,task:'fib',lv:'crit',ic:'🔢',ti:dep+' จำนวน Courier ไม่ตรงกับคนเช็คอิน',
        de:'กรอกไว้ '+p.courierN+' คน แต่เช็คอิน '+ck.length+' คน — PPH จะคำนวณผิด ให้แก้ตัวเลข Courier ในหน้า PPH'});
    try{ const _cm=courierMap(dep,d);
      const _or=Object.keys(d.checkins||{}).filter(cid=>!_cm[cid]).length;
      if(_or) out.push({dep,task:'checkin',lv:'warn',ic:'❓',ti:dep+' มีเช็คอินที่ไม่มีชื่อในระบบ '+_or+' คน',
        de:'รายงานรายบุคคลจะไม่มีชื่อ/รหัส — ตรวจว่าลบพนักงานออกไปหรือรายชื่อยังไม่ซิงค์'}); }catch(e){}
    const _bs=Object.entries(p.rp||{}).filter(([,q])=>q.dep&&q.fdel&&q.fdel<q.dep).length;
    if(_bs) out.push({dep,task:'fdel',lv:'warn',ic:'🔀',ti:dep+' First Del เกิดก่อน Departure '+_bs+' คน',
      de:'เป็นไปไม่ได้จริง — เกิดจากกดปุ่มสลับลำดับหรือแก้เวลา ให้ตรวจสอบ'});
    const _wt=Object.values(d.checkins||{}).filter(r=>{const s=secOf(r.ts); return s<4*3600||s>12*3600;}).length;
    if(_wt) out.push({dep,task:'checkin',lv:'crit',ic:'⏱',ti:dep+' มีเช็คอินนอกช่วงเวลาทำงาน '+_wt+' คน',
      de:'เวลาก่อน 04:00 หรือหลัง 12:00 — มักเป็นข้อมูลทดสอบ ให้ลบออกก่อนทำรายงาน'});
    const noUni=ck.filter(r=>r.uniform===false).length;
    if(noUni) out.push({dep,task:'checkin',lv:'warn',ic:'👕',ti:dep+' ไม่ใส่ยูนิฟอร์ม '+noUni+' คน',
      de:'ตรวจสอบและเตือนก่อนออกวิ่งงาน'});
    const edits=ck.filter(r=>r.manualEdit).length;
    if(edits>=2) out.push({dep,task:'checkin',lv:'warn',ic:'✏️',ti:dep+' แก้เวลาเข้างาน '+edits+' ครั้ง',
      de:'แก้หลายครั้งผิดปกติ — ตรวจว่าเป็นเหตุผลอะไร (กล้องเสีย/ลืมกด)'});

    /* 2) PD */
    const pdTs=p.pd&&p.pd.ts;
    if(pdTs && secOf(pdTs)>PD_END)
      out.push({dep,task:'pd',lv:'crit',ic:'📸',ti:dep+' PD เกินเวลา ('+fmtT(pdTs)+')',
        de:'เป้าคือก่อน 07:15 — เลยมา '+Math.round((secOf(pdTs)-PD_END)/60)+' นาที'});
    if(!pdTs && ck.length && (!isToday || t>7*3600+20*60))
      out.push({dep,task:'pd',lv:'crit',ic:'📸',ti:dep+' ยังไม่ถ่าย PD',
        de:'เช็คอินแล้ว '+ck.length+' คน แต่ยังไม่มีภาพ PD — เลยเวลา 07:15 ไปแล้ว'});

    /* 3) Inbound / Sort */
    if(!p.inboundTs && ck.length && (!isToday || t>7*3600))
      out.push({dep,task:'fib',lv:'warn',ic:'📥',ti:dep+' ยังไม่กด First Inbound',
        de:'ระบบจะคำนวณ PPH Sort ไม่ได้จนกว่าจะกดจุดนี้'});
    const fsDone=rp.filter(x=>x.fs).length;
    if(p.inboundTs && nC && fsDone<nC && (!isToday || t>8*3600))
      out.push({dep,task:'fib',lv:'warn',ic:'🔀',ti:dep+' กด FS ไม่ครบ ('+fsDone+'/'+nC+')',
        de:'PPH Sort จะยังไม่ถูกคำนวณจนกว่าจะกด First Scan ครบทุกคน'});
    const P=pphOf(p,nC);
    if(P.sort!=null && P.sort<49)
      out.push({dep,task:'fib',lv:'warn',ic:'📉',ti:dep+' PPH Sort ต่ำกว่าเป้า ('+(Math.round(P.sort*10)/10)+')',
        de:'เป้า ≥ 49 • พัสดุ '+P.totalP+' ชิ้น ใช้คน '+P.people+' คน — ลองลดคนหรือลดเวลา Inbound→FS'});

    /* 4) Route prep / DEP */
    const deps=rp.map(x=>x.dep).filter(Boolean);
    if(deps.length){
      const a=av(deps.map(secOf));
      if(deps.length>=nC && a>=T_DEP)
        out.push({dep,task:'dep',lv:'crit',ic:'🚚',ti:dep+' Departure เฉลี่ยเกิน 08:30 ('+hmOf(a)+')',
          de:'ออกช้า '+Math.round((a-T_DEP)/60)+' นาที — กระทบ First Del ต่อเนื่อง'});
      const slow=Object.entries(p.rp||{}).filter(([,q])=>q.dep&&secOf(q.dep)>=T_DEP);
      if(slow.length && slow.length<nC)
        out.push({dep,task:'dep',lv:'warn',ic:'🐢',ti:dep+' ออกช้าเป็นรายคน '+slow.length+' คน',
          de:'บางคนออกเกิน 08:30 — แตะดูว่าใครและช้าที่ขั้นตอนไหน'});
    } else if(p.inboundTs && (!isToday || t>8*3600+30*60))
      out.push({dep,task:'dep',lv:'crit',ic:'🚚',ti:dep+' ยังไม่มีใครกด DEP',
        de:'เลย 08:30 แล้วแต่ยังไม่มีการบันทึกเวลาออก'});
    if(P.route!=null && P.route<165)
      out.push({dep,task:'dep',lv:'warn',ic:'📦',ti:dep+' PPH Route prep ต่ำกว่าเป้า ('+Math.round(P.route)+')',
        de:'เป้า ≥ 165 — เวลาที่ใช้ FS→DEP นานเกินไปเทียบกับปริมาณพัสดุ'});

    /* 5) First Del */
    const fd=rp.map(x=>x.fdel).filter(Boolean);
    if(fd.length){
      const a=av(fd.map(secOf));
      if(fd.length>=nC && a>=T_FDEL)
        out.push({dep,task:'fdel',lv:'crit',ic:'🎯',ti:dep+' First Del เฉลี่ยเกิน 09:00 ('+hmOf(a)+')',
          de:'ช้ากว่าเป้า '+Math.round((a-T_FDEL)/60)+' นาที — ตรวจ Stem Out และเส้นทางแรก'});
      const bigStem=Object.entries(p.rp||{}).filter(([,q])=>q.dep&&q.fdel&&(q.fdel-q.dep)/60000>35);
      if(bigStem.length)
        out.push({dep,task:'fdel',lv:'warn',ic:'⏱',ti:dep+' Stem Out นานผิดปกติ '+bigStem.length+' คน',
          de:'ใช้เวลาจาก DEP→จุดส่งแรกเกิน 35 นาที — อาจเป็นเส้นทางไกลหรือหลงทาง'});
    } else if(deps.length && (!isToday || t>9*3600))
      out.push({dep,task:'fdel',lv:'crit',ic:'🎯',ti:dep+' ยังไม่มีใครกด First Del',
        de:'ออกไปแล้วแต่ยังไม่บันทึกการส่งชิ้นแรก — เลย 09:00 แล้ว'});

    /* 6) คอมเมนต์ค้าง */
    const pend=(COM[dep]||[]).filter(c=>!c.ackAt).length;
    if(pend) out.push({dep,task:(COM[dep].find(c=>!c.ackAt)||{}).task||'checkin',lv:'warn',ic:'💬',
      ti:dep+' ยังไม่รับทราบคอมเมนต์ '+pend+' รายการ', de:'ส่งไปแล้วแต่สาขายังไม่กดรับทราบ'});
  });
  const rank={crit:0,warn:1};
  return out.sort((a,b)=>rank[a.lv]-rank[b.lv]);
}

async function loadHist(){
  histLoading=true;
  if(MTAB==='ch') renderCh(); if(MTAB==='ins') renderIns();
  const days=chDates().filter(k=>k!==DATE);
  const H={}; DEPOTS.forEach(d=>H[d]=[]);
  const jobs=[];
  DEPOTS.forEach(dep=> days.forEach(dk=> jobs.push(
    getDoc(doc(db,'depots',dep,'days',dk)).then(s=>{ if(s.exists()) H[dep].push(s.data()); }).catch(()=>{})
  )));
  /* โหลดขนานทีละ 40 คำขอ — เร็วกว่าเรียงกันมาก */
  for(let i=0;i<jobs.length;i+=40) await Promise.all(jobs.slice(i,i+40));
  HIST=H; histLoading=false;
  if(MTAB==='ins') renderIns();
  if(MTAB==='ch') renderCh();
}

const RC={};                                  /* cache: 'DEP|YYYY-MM-DD' -> doc | null */

function dList(f,t){ const o=[]; let k=f,g=0; while(k<=t&&g++<95){ o.push(k); k=addD(k,1); } return o.length?o:[f]; }
function baseRange(){

function cmapAll(dep){
  const m={}, add=l=>(l||[]).forEach(c=>{ if(c&&c.id!=null&&!m[c.id]) m[c.id]=c; });
  add(DATA[dep]&&DATA[dep].couriers);
  Object.keys(RC).forEach(k=>{ if(k.indexOf(dep+'|')===0&&RC[k]) add(RC[k].couriers); });
  if(HIST&&HIST[dep]) HIST[dep].forEach(x=>add(x.couriers));
  add(META[dep]&&META[dep].couriers);
  return m;
}
/* ---- รวมค่าระดับสาขา ---- */
function aggDep(dep,dks){
  let days=0,ckN=0,lateN=0,lateMin=0,okT=0,totT=0,absN=0;
  const pd=[],fib=[],lib=[],dp=[],fd=[];
  dks.forEach(dk=>{
    const d=docOf(dep,dk); if(!d) return;
    const ck=Object.values(d.checkins||{}), p=d.pph||{}, rp=Object.values(p.rp||{});
    if(!ck.length && !p.inboundTs && !rp.length) return;
    days++;
    absN += Object.keys(d.absent||{}).length;
    ck.forEach(r=>{ ckN++; const s=secOf(r.ts);
      if(r.status==='late'||s>GRACE) lateN++;
      lateMin += Math.max(0,s-CUT)/60; });
    if(ck.length){ totT++; if(!ck.some(r=>r.status==='late'||secOf(r.ts)>GRACE)) okT++; }
    if(p.pd&&p.pd.ts){ const s=secOf(p.pd.ts); pd.push(s); totT++; if(s<=PD_END) okT++; }
    if(p.inboundTs) fib.push(secOf(p.inboundTs));
    if(p.lastInboundTs) lib.push(secOf(p.lastInboundTs));
    const a1=rp.map(x=>x.dep).filter(Boolean);
    if(a1.length){ const a=av(a1.map(secOf)); dp.push(a); totT++; if(a<T_DEP) okT++; }
    const a2=rp.map(x=>x.fdel).filter(Boolean);
    if(a2.length){ const a=av(a2.map(secOf)); fd.push(a); totT++; if(a<T_FDEL) okT++; }
  });
  if(!days) return null;
  return { days, head: ckN? Math.round(ckN/days):0, ckN, lateN, absN,
    ontime: ckN? (ckN-lateN)/ckN*100 : null,
    lateAvg: ckN? lateMin/ckN : null,
    pd:av(pd), fib:av(fib), lib:av(lib), dep:av(dp), fdel:av(fd),
    tgt: totT? okT/totT*100 : null };
}
/* ---- รวมค่ารายบุคคล ---- */
function aggPeople(deps,dks){
  const M={};
  deps.forEach(dep=>{
    const cm=cmapAll(dep);
    const get=cid=>{ const k=dep+'|'+cid;
      return M[k]||(M[k]={dep,cid,c:cm[cid]||{},days:0,abs:0,late:0,lateMin:0,fs:[],dp:[],fd:[]}); };
    dks.forEach(dk=>{
      const d=docOf(dep,dk); if(!d) return;
      const p=d.pph||{};
      Object.keys(d.absent||{}).forEach(cid=>{ get(cid).abs++; });
      Object.entries(d.checkins||{}).forEach(([cid,r])=>{
        const o=get(cid); o.days++; const s=secOf(r.ts);
        if(r.status==='late'||s>GRACE) o.late++;
        o.lateMin += Math.max(0,s-CUT)/60;
      });
      Object.entries(p.rp||{}).forEach(([cid,q])=>{
        const o=get(cid);
        if(q.fs) o.fs.push(secOf(q.fs));
        if(q.dep) o.dp.push(secOf(q.dep));
        if(q.fdel) o.fd.push(secOf(q.fdel));
      });
    });
  });
  return Object.values(M).filter(o=>o.days||o.abs||o.fs.length||o.dp.length||o.fd.length)
    .map(o=>({...o, ontime:o.days? (o.days-o.late)/o.days*100:null,
      lateAvg:o.days? o.lateMin/o.days:null,
      fsA:av(o.fs), dpA:av(o.dp), fdA:av(o.fd)}));
}

/* ---- คำนวณ % พัฒนาการ ---- */
const IMET=[
  {k:'ontime', l:'Ontime %',       fmt:v=>Math.round(v)+'%',   hi:true,  tgt:95,    unit:'p'},
  {k:'lateAvg',l:'นาทีสาย/คน',      fmt:v=>m1(v)+' น.',         hi:false, tgt:0,     unit:'m'},
  {k:'pd',     l:'PD',             fmt:hmOf,                   hi:false, tgt:PD_END,unit:'t'},
  {k:'dep',    l:'Departure',      fmt:hmOf,                   hi:false, tgt:T_DEP, unit:'t'},
  {k:'fdel',   l:'First Del',      fmt:hmOf,                   hi:false, tgt:T_FDEL,unit:'t'},
  {k:'tgt',    l:'Task ตามเป้า %',  fmt:v=>Math.round(v)+'%',   hi:true,  tgt:80,    unit:'p'}
];
/* คืน % พัฒนาการ (+ = ดีขึ้น) */
function impPct(m,a,b){
  if(a==null||b==null||isNaN(a)||isNaN(b)) return null;
  if(m.hi){ if(a<=0) return b>0?100:0; return (b-a)/Math.abs(a)*100; }
  if(m.unit==='m'){ if(a<=0) return b<=0?0:-100; return (a-b)/a*100; }
  /* เวลา: วัดจาก "นาทีที่เกินเป้า" */
  const A=Math.max(0,a-m.tgt), B=Math.max(0,b-m.tgt);
  if(A<=0) return B<=0? 0 : -100;
  return (A-B)/A*100;
}
const clamp=v=>Math.max(-100,Math.min(100,v));
function pcHTML(p){
  if(p==null) return '<span class="pc eq">—</span>';
  const c= p>1?'up':(p<-1?'dn':'eq'), s= p>1?'▲':(p<-1?'▼':'•');
  return '<span class="pc '+c+'">'+s+' '+Math.abs(Math.round(p))+'%</span>';
}
function cmpRows(){
  const b=baseRange(), A=dList(b.f,b.t), B=chDates();
  return DEPOTS.map(dep=>{
    const a=aggDep(dep,A), c=aggDep(dep,B);
    if(!a||!c) return {dep,a,c,score:null,det:[]};
    const det=IMET.map(m=>({m, va:a[m.k], vb:c[m.k], p:impPct(m,a[m.k],c[m.k])}));
    const ps=det.map(d=>d.p).filter(p=>p!=null).map(clamp);
    return {dep,a,c,det,score: ps.length? av(ps):null};
  }).filter(x=>x.a&&x.c);
}

function renderData(){
  if(MTAB!=='data') return;

function cvx(id,hpx){
  const c=document.getElementById(id); if(!c) return null;
  const dpr=window.devicePixelRatio||1, w=c.clientWidth||600, hh=hpx||150;
  c.width=w*dpr; c.height=hh*dpr; c.style.height=hh+'px';
  const x=c.getContext('2d'); x.scale(dpr,dpr); return {x,w,h:hh};
}
function drawMetric(m,deps){
  const cv=cvx('ch_'+m.k,150); if(!cv) return;
  const {x,w,h}=cv, dks=chDates(), PB=20,PT=10,PL=44,PR=10;
  const series=deps.map((dep,i)=>({dep,col:PAL[DEPOTS.indexOf(dep)%PAL.length],
    pts:dks.map(dk=>metricOf(dayDoc(dep,dk),m.k))}));
  const vals=series.flatMap(s=>s.pts).filter(v=>v!=null);
  const lg=document.getElementById('lg_'+m.k);
  if(!vals.length){
    x.fillStyle='#c4bca6'; x.font='13px Segoe UI'; x.textAlign='center';
    x.fillText('ยังไม่มีข้อมูลในช่วงนี้', w/2, h/2);
    if(lg) lg.textContent=''; return;
  }
  let vmin=Math.min(...vals,m.k==='late'?0:m.tgt), vmax=Math.max(...vals,m.k==='late'?1:m.tgt);
  const padv=(vmax-vmin)*0.18||1; vmin-=padv; vmax+=padv;
  if(m.unit==='%'){ vmin=Math.max(0,vmin); vmax=Math.min(100,vmax+2); }
  const X=i=> dks.length===1? w/2 : PL+(w-PL-PR)*i/(dks.length-1);
  const Y=v=> PT+(h-PT-PB)*(1-(v-vmin)/(vmax-vmin));
  /* grid + แกน */
  x.strokeStyle='#f0ead9'; x.lineWidth=1;
  [0,.5,1].forEach(f=>{ const v=vmin+(vmax-vmin)*f;
    x.beginPath(); x.moveTo(PL,Y(v)); x.lineTo(w-PR,Y(v)); x.stroke();
    x.fillStyle='#c4bca6'; x.font='9.5px Segoe UI'; x.textAlign='right'; x.textBaseline='middle';
    x.fillText(m.unit==='t'? hmOf(v) : (Math.round(v*10)/10), PL-5, Y(v)); });
  /* เส้นเป้า */
  if(m.k!=='late'){
    x.setLineDash([5,4]); x.strokeStyle='#2e7d32'; x.lineWidth=1.5;
    x.beginPath(); x.moveTo(PL,Y(m.tgt)); x.lineTo(w-PR,Y(m.tgt)); x.stroke(); x.setLineDash([]);
    x.fillStyle='#2e7d32'; x.font='700 9.5px Segoe UI'; x.textAlign='left'; x.textBaseline='bottom';
    x.fillText('เป้า', PL+2, Y(m.tgt)-2);
  }
  /* พื้นไล่เฉด (เฉพาะสาขาเดียว) */
  if(series.length===1){
    const s=series[0], pts=s.pts.map((v,i)=>v==null?null:{x:X(i),y:Y(v)}).filter(Boolean);
    if(pts.length>1){
      x.beginPath(); x.moveTo(pts[0].x,h-PB); pts.forEach(p=>x.lineTo(p.x,p.y));
      x.lineTo(pts[pts.length-1].x,h-PB); x.closePath();
      const gr=x.createLinearGradient(0,0,0,h);
      gr.addColorStop(0,s.col+'55'); gr.addColorStop(1,s.col+'05');
      x.fillStyle=gr; x.fill();
    }
  }
  /* เส้นข้อมูล */
  series.forEach(s=>{
    const pts=s.pts.map((v,i)=>v==null?null:{x:X(i),y:Y(v),v});
    x.strokeStyle=s.col; x.lineWidth=series.length===1?2.8:2;
    x.beginPath(); let started=false;
    pts.forEach(p=>{ if(!p){started=false;return;} started? x.lineTo(p.x,p.y):x.moveTo(p.x,p.y); started=true; });
    x.stroke();
    pts.forEach(p=>{ if(!p) return;
      const good = m.k==='late'? p.v===0 : (m.hi? p.v>=m.tgt : p.v<m.tgt);
      x.beginPath(); x.arc(p.x,p.y,series.length===1?4.5:3.5,0,Math.PI*2);
      x.fillStyle='#fff'; x.fill(); x.lineWidth=2.5;
      x.strokeStyle= series.length===1? (good?'#2e7d32':'#D40511') : s.col; x.stroke(); });
    if(series.length===1){
      x.font='700 10px Segoe UI'; x.textAlign='center'; x.textBaseline='bottom';
      pts.forEach(p=>{ if(!p) return;
        const good= m.k==='late'? p.v===0 : (m.hi? p.v>=m.tgt : p.v<m.tgt);
        x.fillStyle= good?'#1c7a4d':'#b3121d'; x.fillText(m.fmt(p.v), p.x, p.y-8); });
    }
  });
  /* แกนวันที่ */
  x.fillStyle='#a09884'; x.font='9.5px Segoe UI'; x.textAlign='center'; x.textBaseline='top';
  dks.forEach((k,i)=>{ const[,mm,dd]=k.split('-');
    x.fillText((k===todayKey()?'วันนี้':(+dd)+'/'+(+mm)), X(i), h-PB+4); });
  /* legend + สรุป */
  if(lg){
    if(series.length===1){
      const v=series[0].pts.filter(p=>p!=null);
      const avg=av(v), last=v[v.length-1];
      lg.innerHTML= v.length? '<b>'+CHDEP+'</b> • เฉลี่ย '+m.fmt(avg)+' • ล่าสุด '+m.fmt(last) : '';
    } else lg.innerHTML=series.map(s=>'<span style="font-weight:700;color:'+s.col+';margin-right:9px;">● '+s.dep+'</span>').join('');
  }
}

/* ดึงตัวเลข Performance ของสาขาจากข้อมูลวันนี้ */
function perfRows(dep){
  const d=DATA[dep]; if(!d) return [];
  const ck=Object.values(d.checkins||{}), p=d.pph||{}, rp=Object.values(p.rp||{});
  const R=[];
  if(ck.length){
    const late=ck.filter(r=>r.status==='late').length;
    const pct=Math.round((ck.length-late)/ck.length*100);
    R.push({k:'Ontime การเข้างาน', v:pct+'%', t:'95%', ok:pct>=95});
    R.push({k:'จำนวนคนมาสาย', v:late+' คน', t:'0 คน', ok:late===0});
  }
  if(p.pd&&p.pd.ts){ const s=secOf(p.pd.ts);
    R.push({k:'PD', v:hmOf(s), t:'ก่อน 07:15', ok:s<=PD_END}); }
  const dp=rp.map(x=>x.dep).filter(Boolean);
  if(dp.length){ const a=av(dp.map(secOf));
    R.push({k:'Departure เฉลี่ย', v:hmOf(a), t:'ก่อน 08:30', ok:a<T_DEP}); }
  const fd=rp.map(x=>x.fdel).filter(Boolean);
  if(fd.length){ const a=av(fd.map(secOf));
    R.push({k:'First Del เฉลี่ย', v:hmOf(a), t:'ก่อน 09:00', ok:a<T_FDEL}); }
  return R;
}

const BK_KEEP=30; let BKLAST=0;
async function snapshotDay(date, quiet){
  const done=[], fail=[];
  for(const dep of DEPOTS){
    try{
      const [dayS, depS] = await Promise.all([ getDoc(doc(db,'depots',dep,'days',date)), getDoc(doc(db,'depots',dep)) ]);
      if(!dayS.exists()) continue;
      const dd=dayS.data(), pd=depS.exists()? depS.data():{};
      await setDoc(doc(db,'backups',date+'__'+dep),{ date, depot:dep, at:Date.now(), by:'auto',
        checkins: dd.checkins||{}, pph: dd.pph||{}, ckDel: dd.ckDel||{},
        dayCouriers: dd.couriers||[], by0: dd.by||'',
        couriers: pd.couriers||[], staffNames: pd.staffNames||[],
        pin: pd.pin||'', maxStaff: pd.maxStaff||3, removedIds: pd.removedIds||[] });
      done.push(dep);
    }catch(e){ fail.push(dep+': '+e.message); }
  }
  if(!quiet) toastFeed('💾','<b>สำรองข้อมูลแล้ว</b><small>'+date+' • '+done.length+' สาขา'+(fail.length?' • ผิดพลาด '+fail.length:'')+'</small>', fail.length?'bad':'ok');
  return {done, fail};
}
async function bkDocs(){
  const _s=await getDocs(collection(db,'backups'));
  const ds=_s.docs.filter(d=>{ const p=String(d.id).split('__'); return p.length<2 || DEPOTS.indexOf(p[1])>=0; });
  return { docs:ds, size:ds.length };
}
async function purgeOldBackups(){
  try{ const cut=new Date(); cut.setDate(cut.getDate()-BK_KEEP); const cutKey=dKey(cut);
    const s=await bkDocs(); let n=0;
    for(const d of s.docs){ const dt=(d.id.split('__')[0]||''); if(dt && dt<cutKey){ await deleteDoc(d.ref); n++; } }
  }catch(e){ console.warn('purge backups',e); }
}
async function autoBackup(){
  try{ const y=new Date(); y.setDate(y.getDate()-1);
    for(const d of [dKey(y), todayKey()]){
      const probe=await getDoc(doc(db,'backups',d+'__'+DEPOTS[0]));
      const fresh = probe.exists() && (Date.now()-(probe.data().at||0) < 6*3600000);
      if(d===todayKey() || !probe.exists() || !fresh) await snapshotDay(d, true);
    }
    purgeOldBackups(); BKLAST=Date.now();
  }catch(e){ console.warn('autoBackup',e); }
}

    +'<div class="kpi '+(onl.length?'green':'')+'"><div class="v">'+onl.length+'</div><div class="l">กำลังใช้งาน</div></div>'
    +'<div class="kpi"><div class="v">'+devOn+'</div><div class="l">เครื่อง</div></div>'
    +'<div class="kpi"><div class="v">'+all.length+'/'+maxS+'</div><div class="l">ชื่อที่เข้าระบบ</div></div>'
    +'</div>';

  /* 🛡 ตรวจสุขภาพเครื่อง */
  const cloudN=DATA[dep]? Object.keys(DATA[dep].checkins||{}).length : 0;
  const probs=[];
  all.forEach(s=>{
    if(s.err) probs.push({n:s.name, t:'มี Error: '+s.err});
    if(s.ver && s.ver!==APP_VER) probs.push({n:s.name, t:'ใช้เวอร์ชันเก่า ('+s.ver+') — ให้ปิดแอปเปิดใหม่'});
    if(!s.ver) probs.push({n:s.name, t:'ยังไม่ได้อัปเดตแอป — ให้ปิดแอปเปิดใหม่'});
    if(s.nLocal!=null && cloudN && s.nLocal>cloudN)
      probs.push({n:s.name, t:'ข้อมูลในเครื่องมากกว่าคลาวด์ ('+s.nLocal+' vs '+cloudN+') — ยังส่งไม่ครบ'});
    if(s.lastPush && (Date.now()-s.lastPush)>20*60000 && (now-s.at)<ONLINE_MS)
      probs.push({n:s.name, t:'เปิดแอปอยู่แต่ไม่ได้ส่งข้อมูลมา '+agoTxt(Date.now()-s.lastPush)});
  });
  if(probs.length){
    b+='<div style="font-weight:800;font-size:13px;margin-bottom:6px;color:#b3121d;">⚠️ พบปัญหา '+probs.length+' รายการ</div>'
      + probs.map(p=>'<div class="iss crit" style="cursor:default;"><div class="bd">'
        +'<div class="ti">'+esc(p.n)+'</div><div class="de">'+esc(p.t)+'</div></div></div>').join('')
      +'<div style="height:10px"></div>';
  }

  b+='<div style="font-weight:800;font-size:13px;margin-bottom:6px;">🟢 กำลังใช้งานอยู่</div>';
  b+= onl.length ? onl.map(s=>
        '<div class="row-c"><div class="info"><div class="nm">'+esc(s.name)
        +(s.err?' <span style="color:#b3121d;">⚠️</span>':'')+'</div>'
        +'<div class="sub2">เครื่อง #'+esc(String(s.uid||'').slice(-6).toUpperCase()||'—')
        +' • สัญญาณ '+fmtT(s.at)
        +(s.lastPush? ' • ส่งข้อมูลล่าสุด '+fmtT(s.lastPush):'')
        +(s.nLocal!=null? ' • ในเครื่อง '+s.nLocal+' คน':'')
        +'<br>เวอร์ชัน '+esc(s.ver||'เก่า (ยังไม่อัปเดต)')+'</div></div>'
        +'<span class="chip '+(s.err?'no':'ok')+'">'+(s.err?'⚠ ปัญหา':'● Online')+'</span></div>').join('')
      : '<div class="empty" style="padding:18px 10px;">ไม่มีใครเปิดแอปอยู่ตอนนี้</div>';

  if(off.length){
    b+='<div style="font-weight:800;font-size:13px;margin:14px 0 6px;">○ เคยเข้าใช้ (ออฟไลน์)</div>'
      + off.map(s=>
        '<div class="row-c"><div class="info"><div class="nm">'+esc(s.name)+'</div>'
        +'<div class="sub2">เครื่อง #'+esc(String(s.uid||'').slice(-6).toUpperCase()||'—')
        +(s.at? ' • ล่าสุด '+fmtT(s.at):'')+'</div></div>'
        +'<span class="chip">'+(s.at? agoTxt(now-s.at):'—')+'</span></div>').join('');
  }
  if(!all.length) b+='<div class="empty" style="padding:18px 10px;">สาขานี้ยังไม่เคยเข้าสู่ระบบเลย</div>';

  b+='<div style="margin-top:14px;"><button class="btn btn-o" style="width:100%;" '
    +'onclick="document.getElementById(\'mdl\').classList.remove(\'show\')">ปิด</button></div>';
  document.getElementById('mdlBody').innerHTML=b;
  document.getElementById('mdl').classList.add('show');
};

window.__zoom=src=>{
  if(!src||!src.startsWith('data:')) return;
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out';
  o.innerHTML='<img src="'+src+'" style="max-width:100%;max-height:100%;border-radius:12px;">';
  o.onclick=()=>o.remove(); document.body.appendChild(o);
};
async function loadPhotos(){
  const els=[...document.querySelectorAll('[data-ph]')];
  for(const el of els){
    try{
      const s=await getDoc(doc(db,'depots',el.dataset.dep,'photos',el.dataset.ph));
      if(s.exists()&&s.data().d) el.src=s.data().d;
      else el.style.display='none';
    }catch(e){ el.style.display='none'; }
  }
}

/* ---------- ⚙️ ตั้งค่า: PIN Manager + PIN สาขา ---------- */
window.__settings=async ()=>{
  let b='<h3>⚙️ ตั้งค่าระบบ</h3><div class="sub">จัดการ PIN และรายชื่อ Staff</div>';
  b+='<div style="font-weight:800;font-size:13.5px;margin-bottom:7px;">🔑 PIN ของทีมฉัน</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:16px;">'
    +'<input id="pinMg" type="tel" inputmode="numeric" maxlength="6" placeholder="PIN ใหม่ 4–6 หลัก" '
    +'style="flex:1;padding:12px;border:none;border-radius:14px;background:#f2ede2;font-size:16px;font-weight:700;text-align:center;letter-spacing:3px;font-family:inherit;">'
    +'<button class="btn btn-y" onclick="window.__savePin(\'__manager__\')">บันทึก</button></div>';
  b+='<div style="font-weight:800;font-size:13.5px;margin-bottom:7px;">🏢 PIN ของแต่ละสาขา</div>'
    +'<div class="small" style="margin-bottom:9px;">Staff จะล็อกอินได้เฉพาะชื่อที่เพิ่มไว้ที่นี่เท่านั้น • 🟢 = กำลังออนไลน์ • จำกัดจำนวนเครื่องต่อสาขาได้</div>'
    +'<div id="pinList"><div class="small">กำลังโหลด...</div></div>';
  b+='<div style="display:flex;gap:8px;margin-top:16px;">'
    +'<button class="btn btn-o btn-block" onclick="document.getElementById(\'mdl\').classList.remove(\'show\')">ปิด</button></div>';
  document.getElementById('mdlBody').innerHTML=b;
  document.getElementById('mdl').classList.add('show');

  const rows=[]; const now=Date.now();
  const _pf={};
  await Promise.all(DEPOTS.map(async dp=>{ const o={};
    try{ o.d=await getDoc(doc(db,'depots',dp)); }catch(e){}
    try{ o.s=await getDocs(collection(db,'depots',dp,'sessions')); }catch(e){}
    _pf[dp]=o; }));
  for(const dep of DEPOTS){
    let pin='', staff=[], maxN=(dep==='BPE'?4:3);
    try{ const s=(_pf[dep]&&_pf[dep].d)||{exists:()=>false,data:()=>({})};
      if(s.exists()){ pin=s.data().pin||''; staff=s.data().staffNames||[]; maxN=(+s.data().maxStaff)||maxN; } }catch(e){}
    let act=[];
    try{ const ss=(_pf[dep]&&_pf[dep].s)||{docs:[]};
      act=ss.docs.map(x=>({n:x.id,at:x.data().at||0})).filter(x=>now-x.at<6*60*1000).map(x=>x.n); }catch(e){}
    rows.push('<div style="background:#fbf9f4;border-radius:18px;padding:13px;margin-bottom:9px;">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
      +'<b style="font-size:15px;">'+dep+'</b>'
      +(pin?'<span class="chip ok">PIN ตั้งแล้ว</span>':'<span class="chip no">ยังไม่ตั้ง PIN</span>')
      +'<span class="chip" style="background:#ece5d5;color:#5a5140;">'+staff.length+'/'+maxN+' คน</span>'
      +(act.length?'<span class="chip ok">🟢 ออนไลน์ '+act.length+'</span>':'')
      +'<span style="flex:1"></span>'
      +'<input id="pin_'+dep+'" type="tel" inputmode="numeric" maxlength="6" value="'+esc(pin)+'" placeholder="PIN"'
      +' style="width:92px;padding:8px;border:none;border-radius:11px;background:#fff;font-size:14px;font-weight:800;text-align:center;letter-spacing:2px;font-family:inherit;">'
      +'<button class="mini" onclick="window.__savePin(\''+dep+'\')">บันทึก</button></div>'
      +'<div style="margin-top:9px;">'
      + (staff.length? staff.map(n=>'<span style="display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:99px;'
          +'padding:5px 6px 5px 11px;margin:0 5px 5px 0;font-size:12.5px;font-weight:700;">'
          +(act.includes(n)?'🟢 ':'')+esc(n)
          +'<button class="mini" style="background:#fbdfdd;color:#b3261e;padding:2px 7px;font-size:11px;" '
          +'onclick="window.__delStaff(\''+dep+'\',\''+esc(n).replace(/'/g,"\\'")+'\')">✕</button></span>').join('')
        : '<span class="small">ยังไม่มีรายชื่อ — Staff จะล็อกอินไม่ได้จนกว่าจะเพิ่มชื่อ</span>')
      +'</div>'
      +'<div style="display:flex;gap:7px;margin-top:8px;">'
      +'<input id="ns_'+dep+'" placeholder="ชื่อ Staff ใหม่" '+(staff.length>=maxN?'disabled':'')
      +' style="flex:1;padding:9px;border:none;border-radius:11px;background:#fff;font-size:13px;font-family:inherit;'
      +(staff.length>=maxN?'opacity:.45;':'')+'">'
      +'<button class="mini" '+(staff.length>=maxN?'disabled style="opacity:.4;"':'')
      +' onclick="window.__addStaff(\''+dep+'\')">+ เพิ่ม</button>'
      +'<select onchange="window.__setMax(\''+dep+'\',this.value)" style="width:96px;padding:8px;border:none;border-radius:11px;background:#fff;font-size:12px;font-weight:700;font-family:inherit;">'
      + [1,2,3,4,5,6].map(v=>'<option value="'+v+'"'+(v===maxN?' selected':'')+'>สูงสุด '+v+'</option>').join('')
      +'</select></div></div>');
  }
  const el=document.getElementById('pinList'); if(el) el.innerHTML=rows.join('');
};
window.__addStaff=async dep=>{
  const inp=document.getElementById('ns_'+dep), v=(inp.value||'').trim();
  if(!v){ return; }
  try{
    const s=await getDoc(doc(db,'depots',dep));
    const cur=(s.exists()&&s.data().staffNames)||[];
    const maxN=(s.exists()&&+s.data().maxStaff)||(dep==='BPE'?4:3);
    if(cur.includes(v)){ alert('มีชื่อนี้อยู่แล้ว'); return; }
    if(cur.length>=maxN){ alert('สาขา '+dep+' ครบ '+maxN+' คนแล้ว — ลบชื่อเดิมก่อนหรือเพิ่มจำนวนสูงสุด'); return; }
    await setDoc(doc(db,'depots',dep),{depot:dep, staffNames:[...cur,v]},{merge:true});
    window.__settings();
  }catch(e){ alert('เพิ่มไม่สำเร็จ: '+e.message); }
};
window.__delStaff=async (dep,name)=>{
  if(!confirm('ลบ "'+name+'" ออกจากสาขา '+dep+'?\nเครื่องที่ล็อกอินด้วยชื่อนี้จะใช้งานต่อไม่ได้')) return;
  try{
    const s=await getDoc(doc(db,'depots',dep));
    const cur=(s.exists()&&s.data().staffNames)||[];
    await setDoc(doc(db,'depots',dep),{staffNames:cur.filter(x=>x!==name)},{merge:true});
    try{ await deleteDoc(doc(db,'depots',dep,'sessions',name)); }catch(e){}
    window.__settings();
  }catch(e){ alert('ลบไม่สำเร็จ: '+e.message); }
};
window.__setMax=async (dep,v)=>{
  try{ await setDoc(doc(db,'depots',dep),{depot:dep, maxStaff:+v},{merge:true}); window.__settings(); }
  catch(e){ alert('บันทึกไม่สำเร็จ'); }
};
window.__savePin=async dep=>{
  const isMg = dep==='__manager__';
  const inp=document.getElementById(isMg? 'pinMg':'pin_'+dep);
  const v=(inp.value||'').trim();
  if(!/^\d{4,6}$/.test(v)){ alert('PIN ต้องเป็นตัวเลข 4–6 หลัก'); return; }
  try{
    if(isMg){
      if(!TEAM){ alert('ไม่พบทีมของคุณ — ติดต่อผู้ดูแลระบบ'); return; }
      await setDoc(doc(db,'config','teams'),{[TEAM]:{pin:v, updatedAt:Date.now()}},{merge:true});
            alert('✔ เปลี่ยน PIN ผู้จัดการเป็น '+v+' แล้ว');
    } else {
      await setDoc(doc(db,'depots',dep),{depot:dep, pin:v, updatedAt:Date.now()},{merge:true});
      alert('✔ ตั้ง PIN ของสาขา '+dep+' = '+v+' แล้ว');
      window.__settings();
    }
  }catch(e){ alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__send=async (dep,task)=>{
  const t=document.getElementById('cmTxt').value.trim();
  if(!t) return;
  try{
    await addDoc(collection(db,'depots',dep,'comments'),
      { task, date:DATE, text:t, at:Date.now(), by:'Manager', ackAt:null, ackBy:null });
    document.getElementById('mdl').classList.remove('show');
  }catch(e){ alert('ส่งไม่สำเร็จ: '+e.message); }
};

document.getElementById('mdl').addEventListener('click',e=>{
  if(e.target.id==='mdl') e.currentTarget.classList.remove('show');
});

setInterval(()=>{ const d=new Date();
  document.getElementById('clk').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  const k=todayKey(); if(k!==DATE){ DATE=k; start(); }
},1000);

/* 🔔 ตรวจซ้ำทุก 15 วิ กันกรณี render ไม่ถูกเรียก */
setInterval(()=>{ try{ checkDone(); }catch(e){} },15000);
/* 🟢 รีเฟรชสถานะ ON AIR ทุก 30 วิ (heartbeat มาทุก 2 นาที ต้องให้สถานะหมดอายุเองได้) */
setInterval(()=>{ if(MTAB==='live'){ try{ render(); }catch(e){} } },30000);
/* กดค้างที่ปุ่มแจ้งเตือน 1 วิ = ทดสอบ */
(function(){ let t=null; const b=document.getElementById('notiBtn'); if(!b) return;
  const dn=()=>{ t=setTimeout(()=>{ t=null; window.__testNoti(); },900); };
  const up=()=>{ if(t){ clearTimeout(t); t=null; } };
  b.addEventListener('touchstart',dn,{passive:true}); b.addEventListener('touchend',up);
  b.addEventListener('mousedown',dn); b.addEventListener('mouseup',up); b.addEventListener('mouseleave',up);
})();

signInAnonymously(auth).catch(e=>console.warn(e));
onAuthStateChanged(auth,u=>{
  if(!u) return;
  try{ localStorage.removeItem('mgPin'); }catch(e){}
});
</script>
