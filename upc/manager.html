<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFCC00">
<title>DHL UPC · Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--y:#FFCC00;--r:#D40511;--ink:#171717;--mut:#6b6b6b;--bg:#f3f3f1;--line:#e4e4e0;--ok:#0a8a3a;--warn:#b86e00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif;font-size:14.5px}
b,h1,h2,h3,th,.pf{font-family:Prompt,Sarabun,sans-serif}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--y);box-shadow:0 0 0 3px #ffcc0040}
.btn-y{background:var(--y) !important;color:#171717 !important;font-family:Prompt;font-weight:700;padding:10px 16px;border-radius:10px;box-shadow:0 2px 0 #e0b400 !important}
.btn-y:disabled{opacity:.5}
.btn-g{background:#fff;border:1.5px solid var(--line);font-family:Prompt;font-weight:600;padding:9px 14px;border-radius:10px}
.btn-r{background:var(--r);color:#fff;font-family:Prompt;font-weight:600;padding:9px 14px;border-radius:10px}
.sm{padding:6px 10px !important;font-size:13px}
.dhl{font-family:Prompt;font-weight:700;font-style:italic;color:var(--r);font-size:26px;letter-spacing:-1px}
.login{max-width:400px;margin:40px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0001}
.login .brand{background:var(--y);padding:22px;display:flex;gap:12px;align-items:center}
.login .brand small{display:block;color:#5a4a00}
.login .in{padding:18px 22px 22px}.login label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.login input{width:100%}.login .btn-y{width:100%;margin-top:6px;padding:12px}
.err{color:var(--r);min-height:20px;margin:8px 0;font-weight:600}
.foot{text-align:center;color:#a0a09a;font-size:12px;margin:18px 0}
.demo{background:#fff4c2;border:1px dashed #d9ad00;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.demo code{background:#fff;padding:1px 5px;border-radius:5px}
header{position:sticky;top:0;z-index:5;background:var(--y);box-shadow:0 2px 0 #e0b400}
.hrow{display:flex;align-items:center;gap:14px;padding:9px 16px;max-width:1200px;margin:0 auto}
.hrow .who{flex:1;min-width:0}.hrow .who b{display:block;font-size:15px}.hrow .who small{color:#5a4a00}
.tabs{display:flex;gap:4px;padding:0 12px;max-width:1200px;margin:0 auto;overflow-x:auto}
.tabs button{background:none;padding:9px 14px;font-family:Prompt;font-weight:600;color:#5a4a00;border-radius:10px 10px 0 0;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:14px 14px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:#fff;border-radius:14px;padding:11px 12px;border:1px solid var(--line)}
.kpi small{display:block;color:var(--mut);font-size:12px}.kpi b{font-size:22px}
.kpi.g b{color:var(--ok)}.kpi.r b{color:var(--r)}.kpi.m b{color:#777}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.bar .grow{flex:1;min-width:160px}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-family:Prompt;font-size:13px}
.chip.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.card h3{margin:0;padding:11px 14px;font-size:15px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.card h3 .grow{flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--mut);font-weight:600;text-align:left;padding:8px 10px;background:#fafaf8;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid #f0f0ec;vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:#fffbe6}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pct{display:inline-block;min-width:54px;text-align:center;padding:3px 8px;border-radius:999px;font-family:Prompt;font-weight:600;font-size:13px}
.p-g{background:#dff5e6;color:var(--ok)}.p-y{background:#fff1c2;color:#8a6200}.p-r{background:#fde2e4;color:var(--r)}.p-n{background:#eee;color:#888}
.prog{height:7px;background:#eee;border-radius:9px;overflow:hidden;display:flex;min-width:90px}
.prog i{display:block;height:100%}
.late{color:var(--r);font-weight:700}.ok{color:var(--ok);font-weight:700}.mut{color:var(--mut)}
.flag{display:inline-block;background:#fff1c2;color:#8a6200;border-radius:6px;padding:1px 6px;font-size:12px;margin-left:4px}
.flag.r{background:#fde2e4;color:var(--r)}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
.pc{background:#fafaf8;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pc .im{aspect-ratio:3/4;background:#eee;display:grid;place-items:center;color:#999;font-size:12px;text-align:center;cursor:zoom-in}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block}
.pc .tx{padding:7px 9px;font-size:12.5px;line-height:1.35}
.pc .tx b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc.ab .im{background:#f1f1f1}.pc.no .im{background:#fff5f5}
#ov{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 10px}
#ov .pnl{background:var(--bg);border-radius:16px;width:100%;max-width:980px;min-height:200px;box-shadow:0 20px 60px #0006}
#ov .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--y);border-radius:16px 16px 0 0;position:sticky;top:-24px;z-index:2}
#ov .ph b{flex:1;font-size:16px}#ov .pb{padding:14px}
#zoom{position:fixed;inset:0;background:#000d;z-index:50;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#zoom img{max-width:94vw;max-height:94vh;border-radius:8px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.frm label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}.frm input,.frm select,.frm textarea{width:100%}
.note{background:#fff;border-left:4px solid var(--y);padding:10px 12px;border-radius:8px;font-size:13px;color:#444;margin-bottom:10px;line-height:1.6}
.cred{background:#171717;color:#fff;border-radius:12px;padding:14px;font-size:14px;line-height:1.8;margin-top:10px}
.cred b{color:var(--y)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#171717;color:#fff;padding:11px 16px;border-radius:12px;z-index:60;display:none;max-width:90vw}
.lock{font-size:12px;color:#8a6200;background:#fff1c2;border-radius:8px;padding:2px 8px}
.demoRib{background:#171717;color:var(--y);text-align:center;font-size:12px;padding:4px}
.updbar{background:var(--r);color:#fff;text-align:center;padding:7px;font-size:13px}
@media(max-width:640px){.hide-m{display:none}.hrow .dhl{font-size:21px}}
</style>
</head>
<body>
<div id="app"><div class="empty">กำลังโหลด…</div></div>
<div id="ov" onclick="if(event.target===this)__ovClose()"><div class="pnl"><div class="ph"><b id="ov_t"></b><button class="btn-g sm" onclick="__ovClose()">✕ ปิด</button></div><div class="pb" id="ov_b"></div></div></div>
<div id="zoom" onclick="this.style.display='none'"><img id="zoom_i" alt=""></div>
<div id="toast"></div>

<script type="module">
import { initFB, DEMO, FB_VER, NOW, DEL, toMs, depotEmail, mgrEmail } from './fb.js?v=2026.09.25-a';

const APP_VER = FB_VER;
const CUT = 25200, GRACE = 25800;          // 07:00 กฎ / 07:10 เกณฑ์ผ่อนผัน (เห็นเฉพาะ Manager)
const KEEP_DAYS = 30;
const REGIONS = ['เหนือ','อีสาน','กลาง','ตะวันออก','ตะวันตก','ใต้'];
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey = () => ymd(new Date());
const kd = k => new Date(k+'T00:00:00');
const isSun = k => kd(k).getDay() === 0;
const hm = ms => { const d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const hms = ms => { const d=new Date(ms); return hm(ms)+':'+pad(d.getSeconds()); };
const secOf = ms => { const d=new Date(ms); return d.getHours()*3600+d.getMinutes()*60+d.getSeconds(); };
const TH_D = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสฯ','ศุกร์','เสาร์'];
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate = k => { const d=kd(k); return TH_D[d.getDay()]+' '+d.getDate()+' '+TH_M[d.getMonth()]+' '+(d.getFullYear()+543); };
const fmt1 = v => (Math.round(v*10)/10).toLocaleString('th-TH');
const pctCls = p => p==null ? 'p-n' : p>=95 ? 'p-g' : p>=80 ? 'p-y' : 'p-r';
const pctTxt = p => p==null ? '–' : fmt1(p)+'%';

let fb, PUB = {}, PMG = {}, CFG = {}, ME = null, SCOPE = [], DEPS = {}, TODAY = {}, TKEY = '';
let TAB = 'live', REG = '', QQ = '', SORT = 'no', UNS = [], TUNS = [], RT = null;
const PH = {};   // cache รูป

function toast(t, ms=2800){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>e.style.display='none', ms); }
window.__ovClose = () => { $('#ov').style.display='none'; OVDEP=null; };
function ov(title, html){ $('#ov_t').textContent = title; $('#ov_b').innerHTML = html; $('#ov').style.display='flex'; $('#ov').scrollTop=0; }
window.__zoom = src => { $('#zoom_i').src = src; $('#zoom').style.display='flex'; };

/* ---------------- เริ่มต้น / ล็อกอิน ---------------- */
(async function boot(){
  try { fb = await initFB(); }
  catch(e){ app.innerHTML = '<div class="login"><div class="brand"><span class="dhl">DHL</span><b>UPC Manager</b></div><div class="in"><div class="err">'+esc(e.message)+'</div></div></div>'; return; }
  await loadPub();
  fb.onAuth(async uid => {
    if (!uid) { stopAll(); ME=null; return renderLogin(); }
    if (ME) return;
    try {
      const m = await fb.get('managers/'+uid);
      if (!m) { await fb.signOut(); return renderLogin('บัญชีนี้ยังไม่ได้รับสิทธิ์ หรือรหัสผ่านถูกรีเซ็ตแล้ว'); }
      ME = { ...m, uid }; startMgr();
    } catch(e){ renderLogin('เชื่อมต่อไม่ได้: '+(e.code||e.message)); }
  });
})();
async function loadPub(){
  try { PUB = (await fb.get('pub/depots')) || {}; } catch(e){ PUB = {}; }
  try { PMG = (await fb.get('pub/mgrs')) || {}; } catch(e){ PMG = {}; }
}

async function renderLogin(msg){
  let firstRun = false;
  try { firstRun = !(await fb.get('config/adminLock')); } catch(e){}
  app.innerHTML = `<div class="login"><div class="brand"><span class="dhl">DHL</span><div><b>UPC Manager</b><small>ติดตามการลงเวลาเข้างาน</small></div></div><div class="in">
    ${DEMO?'<div class="demo">🧪 <b>โหมดทดลอง</b><br>Admin: <code>admin</code> / <code>admin123</code><br>UPC: <code>upc.north</code> / <code>north123</code><br><a href="#" onclick="__resetDemo();return false">↺ ล้างข้อมูลทดลอง</a></div>':''}
    ${firstRun ? `<div class="note" style="margin-top:12px">🔑 <b>ตั้งค่าครั้งแรก</b> — ยังไม่มีผู้ดูแลระบบ สร้างบัญชี Admin ของคุณก่อน (ทำได้ครั้งเดียว)</div>
      <label>ชื่อผู้ใช้ (ภาษาอังกฤษ)</label><input id="su_u" autocapitalize="off" placeholder="เช่น winnie">
      <label>ชื่อที่แสดง</label><input id="su_n" placeholder="เช่น วินนี่">
      <label>รหัสผ่าน (อย่างน้อย 8 ตัว)</label><input id="su_p" type="password">
      <div class="err" id="lg_err">${esc(msg||'')}</div><button class="btn-y" id="lg_btn" onclick="__setup()">สร้างบัญชีผู้ดูแลระบบ</button>`
    : `<label>ชื่อผู้ใช้</label><input id="lg_u" autocapitalize="off" value="${esc(localStorage.getItem('upcm_user')||'')}">
      <label>รหัสผ่าน</label><input id="lg_p" type="password">
      <div class="err" id="lg_err">${esc(msg||'')}</div><button class="btn-y" id="lg_btn" onclick="__login()">เข้าสู่ระบบ</button>`}
    </div></div><div class="foot">v${APP_VER} · Design By Winnie</div>`;
  const p = $('#lg_p'); p && p.addEventListener('keydown', e => { if (e.key==='Enter') __login(); });
}
function lgErr(t, label){ $('#lg_err').textContent = t; const b=$('#lg_btn'); b.disabled=false; b.textContent=label||'เข้าสู่ระบบ'; }
window.__resetDemo = () => { if (confirm('ล้างข้อมูลทดลองทั้งหมด?')) { fb.resetDemo(); location.reload(); } };

window.__login = async () => {
  const u = $('#lg_u').value.trim().toLowerCase(), p = $('#lg_p').value;
  if (!u || !p) return lgErr('กรอกชื่อผู้ใช้และรหัสผ่าน');
  const b=$('#lg_btn'); b.disabled=true; b.textContent='กำลังเข้าสู่ระบบ…';
  await loadPub();
  try { await fb.signIn(mgrEmail(u, PMG[u]||1), p); localStorage.setItem('upcm_user', u); }
  catch(e){ lgErr(e.code==='auth/network-request-failed' ? 'ไม่มีอินเทอร์เน็ต' : e.code==='auth/too-many-requests' ? 'ลองผิดหลายครั้ง — รอสักครู่' : 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); }
};
window.__setup = async () => {
  const u = $('#su_u').value.trim().toLowerCase(), n = $('#su_n').value.trim(), p = $('#su_p').value;
  if (!/^[a-z0-9._-]{3,30}$/.test(u)) return lgErr('ชื่อผู้ใช้: a-z 0-9 . _ - อย่างน้อย 3 ตัว', 'สร้างบัญชีผู้ดูแลระบบ');
  if (!n || p.length < 8) return lgErr('กรอกชื่อ และรหัสผ่านอย่างน้อย 8 ตัว', 'สร้างบัญชีผู้ดูแลระบบ');
  const b=$('#lg_btn'); b.disabled=true; b.textContent='กำลังสร้าง…';
  try {
    ME = { name:n, role:'admin', depots:[], user:u };
    const uid = await fb.createSelf(mgrEmail(u,1), p);
    await fb.set('config/adminLock', { uid, at: NOW });
    await fb.set('managers/'+uid, { name:n, role:'admin', depots:[], user:u, createdAt: NOW });
    await fb.set('pub/mgrs', { [u]: 1 });
    await fb.set('pub/depots', {});
    await fb.set('config/app', { staffVer: APP_VER, managerVer: APP_VER, keepDays: KEEP_DAYS });
    localStorage.setItem('upcm_user', u);
    ME.uid = uid; await loadPub(); startMgr(); TAB='admin'; render();
  } catch(e){ ME=null; lgErr('สร้างไม่สำเร็จ: '+(e.code||e.message), 'สร้างบัญชีผู้ดูแลระบบ'); }
};
window.__logout = async () => { if (!confirm('ออกจากระบบ?')) return; stopAll(); ME=null; await fb.signOut(); };

function stopAll(){ UNS.forEach(u=>u&&u()); UNS=[]; TUNS.forEach(u=>u&&u()); TUNS=[]; DEPS={}; TODAY={}; }

function startMgr(){
  stopAll(); TAB = 'live'; REG = ''; QQ = ''; OT = null; HD = null; HDEP = null;
  SCOPE = (ME.role==='admin' ? Object.keys(PUB) : (ME.depots||[])).slice().sort();
  app.innerHTML = `${DEMO?'<div class="demoRib">🧪 โหมดทดลอง — ข้อมูลไม่ใช่ของจริง</div>':''}<div id="upd"></div>
  <header><div class="hrow"><span class="dhl">DHL</span><div class="who"><b>UPC Manager</b><small>👤 ${esc(ME.name)}${ME.role==='admin'?' · ผู้ดูแลระบบ':''} · ${SCOPE.length} สาขา</small></div>
    <span class="hide-m mut" id="clk" style="font-family:Prompt;font-weight:700;color:#171717"></span><button class="btn-g sm" onclick="__logout()">ออกจากระบบ</button></div>
  <div class="tabs" id="tabs"></div></header><main id="main"></main>`;
  SCOPE.forEach(dep => UNS.push(fb.listen('depots/'+dep, (d, m) => { if (d) DEPS[dep] = d; sched(); })));
  UNS.push(fb.listen('config/app', d => { CFG = d || {}; checkVer(); }));
  if (ME.role !== 'admin') UNS.push(fb.listen('managers/'+ME.uid, d => { if (!d) { toast('สิทธิ์ของบัญชีนี้ถูกยกเลิก'); fb.signOut(); } }));
  listenToday();
  render();
}
function listenToday(){
  TUNS.forEach(u=>u&&u()); TUNS=[]; TODAY={}; TKEY = todayKey();
  SCOPE.forEach(dep => TUNS.push(fb.listen(`depots/${dep}/days/${TKEY}`, d => { TODAY[dep] = d || {}; sched(); })));
}
function sched(){ clearTimeout(RT); RT = setTimeout(() => { if (TAB==='live') render(); if (OVDEP && OVDEP.live) openDep(OVDEP.dep, TKEY, true); }, 200); }
setInterval(() => { const c=$('#clk'); if (c) c.textContent = hms(Date.now()); if (ME && todayKey()!==TKEY) listenToday(); }, 1000);

function checkVer(){
  const want = CFG.managerVer, box = $('#upd'); if (box) box.innerHTML='';
  if (!want || want === APP_VER) return;
  const k = 'upcmReload_'+want;
  if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k,'1'); const u=new URL(location.href); u.searchParams.set('r',Date.now()); location.replace(u.toString()); }
  else if (box) box.innerHTML = '<div class="updbar">มีเวอร์ชันใหม่ ('+esc(want)+') — กด Ctrl+F5 / ปิดแล้วเปิดใหม่</div>';
}

const TABS = [['live','🟢 วันนี้'],['hist','📷 ย้อนหลัง'],['ot','⏱ On-time'],['admin','⚙️ แอดมิน']];
window.__tab = t => { TAB = t; render(); scrollTo(0,0); };
function render(){
  if (TAB==='admin' && ME.role!=='admin') TAB = 'live';
  $('#tabs').innerHTML = TABS.filter(t => t[0]!=='admin' || ME.role==='admin').map(t=>`<button class="${TAB===t[0]?'on':''}" onclick="__tab('${t[0]}')">${t[1]}</button>`).join('');
  if (TAB==='live') renderLive(); else if (TAB==='hist') renderHist(); else if (TAB==='ot') renderOt(); else renderAdmin();
}

/* ---------------- ข้อมูลกลาง ---------------- */
const depName = dep => (DEPS[dep] && DEPS[dep].name) || (PUB[dep] && PUB[dep].name) || dep;
const regions = () => [...new Set(SCOPE.map(d => (DEPS[d]&&DEPS[d].region)||'').filter(Boolean))];
const inReg = dep => !REG || ((DEPS[dep]&&DEPS[dep].region)===REG);
function clockOff(x){                       // นาทีที่เวลาเครื่องต่างจากเวลาเซิร์ฟเวอร์ (0 = ปกติ)
  const s = toMs(x.srv); if (!s || !x.ts) return 0;
  const d = (s - x.ts) / 60000;
  if (x.off) return d < -2 ? Math.round(d) : 0;          // ออฟไลน์: ส่งช้าได้ แต่ห้ามเวลาเครื่องล้ำอนาคต
  return Math.abs(d) > 5 ? Math.round(d) : 0;
}
function people(dep, day){
  const R = ((DEPS[dep]&&DEPS[dep].roster)||[]);
  const ck = (day&&day.checkins)||{}, ab = (day&&day.absent)||{};
  const out = [], seen = new Set();

}
function depStat(dep, day, cut=CUT){
  const P = people(dep, day);
  const s = { dep, n:P.length, inn:0, late:0, ab:0, no:0, flag:0, first:0, last:0 };
  P.forEach(p => {
    if (p.ck) { s.inn++; if (secOf(p.ck.ts) > cut) s.late++; if (clockOff(p.ck)) s.flag++;
      s.first = s.first ? Math.min(s.first, p.ck.ts) : p.ck.ts; s.last = Math.max(s.last, p.ck.ts); }
    else if (p.ab) s.ab++; else s.no++;
  });
  s.pct = s.inn ? (s.inn - s.late) / s.inn * 100 : null;
  return s;
}

async function createDepot(code, name, region, province, pin){
  const uid = await fb.createUser(depotEmail(code, 1), pin);
  await fb.set('depots/'+code, { code, name, region, province, authUid: uid, authVer: 1, roster: [], staffNames: [], createdAt: NOW });
  await fb.set('pub/depots', { [code]: { ver: 1, name } });
  PUB[code] = { ver: 1, name };
  if (!SCOPE.includes(code)) { SCOPE.push(code); SCOPE.sort();
    UNS.push(fb.listen('depots/'+code, d => { if (d) DEPS[code] = d; sched(); }));
    TUNS.push(fb.listen(`depots/${code}/days/${TKEY}`, d => { TODAY[code] = d || {}; sched(); })); }

    $('#w_out').innerHTML = credBox('รหัสผ่านใหม่ของ '+esc(m.name), ['ลิงก์: '+esc(mgrUrl()), 'ชื่อผู้ใช้: '+esc(m.user), 'รหัสผ่าน: '+esc(pw)]);
    renderAdmin();
  } catch(e){ $('#w_err').textContent = 'ไม่สำเร็จ: '+(e.code||e.message); $('#w_btn').disabled = false; }
};
window.__aMdel = async uid => {
  const m = MGRS.find(x=>x.uid===uid);
  if (!confirm('ลบสิทธิ์ของ '+m.name+' ?\nบัญชีนี้จะเข้าดูข้อมูลไม่ได้อีก')) return;
  await fb.del('managers/'+uid);
  toast('ลบสิทธิ์แล้ว'); renderAdmin();
};
</script>
