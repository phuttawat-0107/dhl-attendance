<style>
/* เสริมเล็กน้อยสำหรับ UPC — ใช้คลาส/สีเดียวกับต้นฉบับ */
#login input.txt{letter-spacing:0;font-size:15px;text-align:left;font-weight:600;}
#login .demo{background:#fff8d9;border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.6;color:#6b5a1a;margin:0 0 14px;}
#login .demo b{color:#1a1a1a;} #login .demo a{color:#D40511;font-weight:800;}
#login .ver{font-size:10.5px;color:#c4bca6;text-align:center;margin-top:12px;}
#login.hide{display:none;}
.demoRib{position:fixed;left:12px;bottom:14px;z-index:70;background:#FFCC00;color:#1a1a1a;font-size:11px;font-weight:800;padding:8px 12px;border-radius:99px;box-shadow:0 3px 12px rgba(0,0,0,.2);}
#updBar{display:none;background:#D40511;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;}
table.grid col.c-dep{width:24%;} table.grid col.c-task{width:19%;}
td.cell.none{background:#f2ede2;color:#b0a892;}
.flagc{display:inline-block;background:#fff3d6;color:#a06a00;border-radius:6px;padding:0 5px;font-size:9px;font-weight:800;margin-left:3px;}
.sheet .grp{font-size:11px;font-weight:800;color:#8a8272;margin:12px 0 6px;letter-spacing:.3px;}

.frm2 label{display:block;font-size:11px;font-weight:800;color:#8a8272;margin:10px 0 4px;}

.pick{display:flex;flex-wrap:wrap;gap:5px;}

.pick input{width:auto !important;min-height:0 !important;margin:0;}

<body>

<div id="login"><div class="box"><div class="yb"></div>
  <div id="lgBody"></div>

<div id="updBar"></div>
<div class="topbar"><div class="ybar"></div>
  <div class="hd">
    <div class="mlogo"><img class="dhlmark" src="logo.webp" alt="DHL eCommerce"><span class="liveTag">Live</span><small id="teamTag" style="display:block;font-size:10px;font-weight:700;color:#a09884;letter-spacing:.3px;"></small></div>
    <div class="meta" style="display:flex;align-items:center;gap:10px;">
      <div><div class="live"><i></i>REAL-TIME</div><span id="clk">--:--:--</span></div>

      <button class="btn btn-o" style="min-height:38px;padding:8px 12px;font-size:15px;" onclick="window.__logout()" title="ออกจากระบบ">🚪</button>

<div class="wrap">
  <div class="mtabs">
    <button class="mtab on" id="tb_live" onclick="window.__tab('live')">🔴 Live</button>

    <button class="mtab" id="tb_ch" onclick="window.__tab('ch')">📊 กราฟ</button>
    <button class="mtab" id="tb_data" onclick="window.__tab('data')">📋 Data</button>

      <div class="legend"><span><i style="background:#e6f5eb"></i>ครบ / ทัน</span><span><i style="background:#fff6d6"></i>รอ / ขาด-ลา</span><span><i style="background:#fdeaea"></i>สาย / ยังไม่ลง (เลยเวลา)</span><span>แตะช่องเพื่อดูรายชื่อ + รูป</span></div>

<div class="modal" id="mdl" onclick="if(event.target===this)window.__close()"><div class="sheet" id="mdlBody"></div></div>
<div id="feed"></div>

<script type="module">
import { initFB, DEMO, FB_VER, NOW, DEL, toMs, depotEmail, mgrEmail, mgrPw, CUT, GRACE } from './fb.js?v=2026.09.25-c';

const APP_VER = FB_VER, KEEP_DAYS = 30;
/* ภาคตามโครงสร้าง UPC: Central / East / North / North-East / South */
const REGIONS = ['กลาง','ตะวันออก','เหนือ','อีสาน','ใต้'];
const REG_EN = { 'กลาง':'Central', 'ตะวันออก':'East', 'เหนือ':'North', 'อีสาน':'North-East', 'ใต้':'South' };
const regLabel = r => r ? r + (REG_EN[r] ? ' ('+REG_EN[r]+')' : '') : '—';
function regOf(txt){
  const t = String(txt||'').trim().toLowerCase();
  if (/north.?east|อีสาน|ตะวันออกเฉียงเหนือ/.test(t)) return 'อีสาน';
  if (/north|เหนือ/.test(t)) return 'เหนือ';
  if (/east|ตะวันออก/.test(t)) return 'ตะวันออก';
  if (/south|ใต้/.test(t)) return 'ใต้';
  if (/central|กลาง/.test(t)) return 'กลาง';
  return '';
}
/* รายชื่อ UPC Manager แต่ละภาค (อัปเดต 25 ก.ย. 2569) — ใช้เติมในหน้า "นำเข้าผู้จัดการ" */
const UPC_LIST = [
  ['K.Kobkiat Doungthong','Central'], ['K.Prasitchai Krobsuan','Central'],
  ['K.Phongthep Sendi','East'], ['K.Suttipong Kongchiyapoom','East'],
  ['K.Khanaphot Chaiwong','North'], ['K.Piyaphan Chosinmingson','North'],
  ['K.Aummarin Auppakarat','North-East'], ['K.Sant Pimma','North-East'], ['K.Suphasil Nanthong','North-East'], ['K.Wanchai Prukrunggroj','North-East'],
  ['K.Kittisak Chanakul','South'], ['K.Srichon Chaiyasad','South']
];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey = () => ymd(new Date());
const hm = ts => { const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const hms = ts => { const d=new Date(ts); return hm(ts)+':'+pad(d.getSeconds()); };
const secOf = ts => { const d=new Date(ts); return d.getHours()*3600+d.getMinutes()*60+d.getSeconds(); };
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function thDate(k){ const d=new Date(k+'T00:00:00'); const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; return d.getDate()+' '+M[d.getMonth()]+' '+(d.getFullYear()+543); }
const isLate = r => r && (r.status==='late' || secOf(r.ts) > GRACE);
const genPin = () => String(Math.floor(100000 + Math.random()*900000));

let fb, PUB = {}, CFG = {}, ME = null, SCOPE = [], DEPS = {}, TODAY = {}, TKEY = todayKey(), TAB = 'live', REG = '';
let UNS = [], TUNS = [], RT = null, OPENDEP = null;
const PH = {};

function feed(t, cls){ const f=$('feed'), d=document.createElement('div'); d.className='fitem '+(cls||''); d.innerHTML='<span class="ic">ℹ️</span><div class="tx">'+t+'</div>'; f.appendChild(d); setTimeout(()=>d.remove(), 3200); }
window.__close = () => { $('mdl').classList.remove('show'); OPENDEP = null; };
function modal(h){ $('mdlBody').innerHTML = h; $('mdl').classList.add('show'); $('mdlBody').scrollTop = 0; }
const zoomSrc = {};
window.__zoomImg = k => { if (window.__phZoom) return window.__phZoom(zoomSrc[k], k); const w = window.open(); if (w) w.document.write('<img src="'+zoomSrc[k]+'" style="max-width:100%">'); };

/* ================= LOGIN (PIN อย่างเดียว เหมือนต้นฉบับ) ================= */
(async function boot(){
  $('lgVer').textContent = 'v'+APP_VER+' · Design By Winnie';
  try { fb = await initFB(); }
  catch(e){ $('lgBody').innerHTML = '<h3>DHL Manager</h3><div class="err">'+esc(e.message)+'</div>'; return; }
  if (DEMO) document.body.insertAdjacentHTML('beforeend','<div class="demoRib">🧪 โหมดทดลอง</div>');
  await loadPub();
  fb.onAuth(async uid => {
    if (!uid) { stopAll(); ME = null; return renderLogin(); }
    if (ME) return;
    try {
      const m = await fb.get('managers/'+uid);
      if (!m) { await fb.signOut(); return renderLogin('PIN นี้ยังไม่ได้รับสิทธิ์ หรือถูกเปลี่ยนแล้ว'); }
      ME = { ...m, uid }; start();
    } catch(e){ renderLogin('เชื่อมต่อไม่ได้: '+(e.code||e.message)); }
  });
})();
async function loadPub(){ try { PUB = (await fb.get('pub/depots')) || {}; } catch(e){ PUB = {}; } }
window.__resetDemo = () => { if (confirm('ล้างข้อมูลทดลองทั้งหมด?')) { fb.resetDemo(); location.reload(); } };

async function renderLogin(msg){
  $('login').classList.remove('hide');
  let first = false; try { first = !(await fb.get('config/adminLock')); } catch(e){}
  const demo = DEMO ? '<div class="demo">🧪 <b>โหมดทดลอง</b><br>Admin PIN <b>999999</b><br>UPC: กลาง <b>110001</b> · ตะวันออก <b>120001</b> · เหนือ <b>130001</b> · อีสาน <b>140001</b> · ใต้ <b>150001</b><br><a href="#" onclick="window.__resetDemo();return false">↺ ล้างข้อมูลทดลอง</a></div>' : '';
  $('lgBody').innerHTML = first
    ? '<h3>ตั้งค่าครั้งแรก</h3><p>ยังไม่มีผู้ดูแลระบบ — ตั้ง PIN ผู้ดูแลของคุณ (ทำได้ครั้งเดียว)</p>'
      + '<input id="suName" class="txt" placeholder="ชื่อของคุณ">'
      + '<input id="mgPin" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••">'
      + '<div class="err" id="mgErr">'+esc(msg||'')+'</div><button class="btn btn-y btn-block" id="mgGo" onclick="window.__setup()">สร้างผู้ดูแลระบบ</button>'
    : '<h3>DHL Manager</h3><p>ใส่ PIN ผู้จัดการ — จะเห็นเฉพาะสาขาในความดูแลของ PIN นั้น</p>' + demo
      + '<input id="mgPin" type="tel" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off">'
      + '<div class="err" id="mgErr">'+esc(msg||'')+'</div><button class="btn btn-y btn-block" id="mgGo" onclick="window.__login()">เข้าใช้งาน</button>';
  const p = $('mgPin'); p.focus(); p.addEventListener('keydown', e => { if (e.key==='Enter') $('mgGo').click(); });
}
function lgErr(t){ $('mgErr').textContent = t; $('mgGo').disabled = false; }
window.__login = async () => {
  const pin = $('mgPin').value.trim();
  if (!/^\d{6}$/.test(pin)) return lgErr('PIN ต้องเป็นตัวเลข 6 หลัก');
  $('mgGo').disabled = true; $('mgErr').textContent = 'กำลังตรวจสอบ...';
  try { await fb.signIn(mgrEmail(pin), mgrPw(pin)); }
  catch(e){ $('mgPin').value=''; lgErr(e.code==='auth/network-request-failed' ? 'เชื่อมต่อไม่ได้' : e.code==='auth/too-many-requests' ? 'ลองผิดหลายครั้ง — รอสักครู่แล้วลองใหม่' : 'PIN ไม่ถูกต้อง'); }
};
window.__setup = async () => {
  const name = $('suName').value.trim(), pin = $('mgPin').value.trim();
  if (!name) return lgErr('ใส่ชื่อของคุณ');
  if (!/^\d{6}$/.test(pin)) return lgErr('PIN ต้องเป็นตัวเลข 6 หลัก');
  $('mgGo').disabled = true; $('mgErr').textContent = 'กำลังสร้าง...';
  try {
    ME = { name, role:'admin', depots:[] };
    const uid = await fb.createSelf(mgrEmail(pin), mgrPw(pin));
    await fb.set('config/adminLock', { uid, at: NOW });
    await fb.set('managers/'+uid, { name, role:'admin', depots:[], createdAt: NOW });
    await fb.set('pub/depots', {});
    await fb.set('config/app', { staffVer: APP_VER, managerVer: APP_VER, keepDays: KEEP_DAYS });
    ME.uid = uid; await loadPub(); start(); window.__settings();
  } catch(e){ ME = null; lgErr('สร้างไม่สำเร็จ: '+(e.code||e.message)); }
};
window.__logout = async () => { if (!confirm('ออกจากระบบ?')) return; stopAll(); ME = null; await fb.signOut(); };
function stopAll(){ UNS.forEach(u=>u&&u()); UNS=[]; TUNS.forEach(u=>u&&u()); TUNS=[]; DEPS={}; TODAY={}; }

/* ================= START ================= */
function start(){
  stopAll(); TAB = 'live'; REG = '';
  $('login').classList.add('hide');
  SCOPE = (ME.role==='admin' ? Object.keys(PUB) : (ME.depots||[])).slice().sort();
  $('teamTag').textContent = 'UPC · '+ME.name+' · '+SCOPE.length+' สาขา';
  $('admBtn').style.display = ME.role==='admin' ? '' : 'none';
  SCOPE.forEach(watchDep);
  UNS.push(fb.listen('config/app', d => { CFG = d || {}; checkVer(); }));
  if (ME.role !== 'admin') UNS.push(fb.listen('managers/'+ME.uid, d => { if (!d) { alert('สิทธิ์ของ PIN นี้ถูกยกเลิก'); fb.signOut(); } }));
  listenToday(); initModules(); window.__tab('live');
}
function watchDep(dep){ UNS.push(fb.listen('depots/'+dep, d => { if (d) DEPS[dep] = d; sched(); })); }
function listenToday(){
  TUNS.forEach(u=>u&&u()); TUNS=[]; TODAY={}; TKEY = todayKey();
  SCOPE.forEach(dep => TUNS.push(fb.listen(`depots/${dep}/days/${TKEY}`, d => { TODAY[dep] = d || {}; sched(); })));
}
function sched(){ clearTimeout(RT); RT = setTimeout(() => {
  if (TAB==='live') renderLive();
  else if ((TAB==='ins' || TAB==='data') && window.__anRepaint && !$('mdl').classList.contains('show')) window.__anRepaint();
  if (OPENDEP) openDep(OPENDEP, true); }, 400); }
setInterval(() => { $('clk').textContent = hms(Date.now()); if (ME && todayKey()!==TKEY) listenToday(); }, 1000);

function checkVer(){
  const want = CFG.managerVer, bar = $('updBar'); bar.style.display='none';
  if (!want || want === APP_VER) return;
  const k = 'upcmReload_'+want;
  if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k,'1'); const u=new URL(location.href); u.searchParams.set('r',Date.now()); location.replace(u.toString()); }
  else { bar.textContent = 'มีเวอร์ชันใหม่ ('+want+') — กด Ctrl+F5 หรือปิดแล้วเปิดใหม่'; bar.style.display='block'; }
}

/* ================= โมดูล On-time / ย้อนหลัง (ตัวเดียวกับต้นฉบับ) ================= */
const depsInView = () => SCOPE.filter(d => !REG || ((DEPS[d]&&DEPS[d].region)===REG));
function ctx(){
  return {
    db: null,
    doc: (db, ...p) => p.join('/'),
    getDoc: async p => { const d = await fb.get(p); return { exists: () => !!d, data: () => d }; },
    esc, secOf, toMs, fb,
    modal, close: () => window.__close(),
    get: () => {
      const META = {}, DATA = {};
      SCOPE.forEach(d => { META[d] = { couriers: (DEPS[d] && DEPS[d].roster) || [] }; DATA[d] = TODAY[d] || {}; });
      return { DEPOTS: depsInView(), DATA, META, TODAY: DATA, DATE: TKEY, MTAB: TAB };
    }
  };
}
let MODS = false;
function initModules(){
  if (MODS) return; MODS = true;
  import('./upc-analytics.js?v=2').then(m => { m.initAnalytics(ctx()); if (['ins','ch','data'].includes(TAB)) window.__anRender(); }).catch(e => console.warn('analytics', e));
  import('../dhl-photos.js?v=4').then(m => m.initPhotos(ctx())).catch(e => console.warn('photos', e));
}
const VIEWS = { live:'viewLive', ins:'viewIns', ch:'viewCh', data:'viewData', ph:'viewPh' };
window.__tab = t => {
  TAB = t;
  Object.keys(VIEWS).forEach(x => { $('tb_'+x).classList.toggle('on', x===t); $(VIEWS[x]).style.display = x===t ? '' : 'none'; });
  if (t==='live') renderLive();
  if (['ins','ch','data'].includes(t) && window.__anRender) window.__anRender();
  if (t==='ph' && window.__phRender) { window.__phRender(); window.__phEnsure(); }
};

/* ================= LIVE ================= */
function people(dep, day){
  const R = (DEPS[dep] && DEPS[dep].roster) || [], ck = (day&&day.checkins)||{}, ab = (day&&day.absent)||{};
  const out = [], seen = new Set();
  R.forEach(c => { const id = String(c.id); if (c.active===false && !ck[id] && !ab[id]) return; seen.add(id);
    out.push({ c, id, ck: ck[id]&&ck[id].ts ? ck[id] : null, ab: !(ck[id]&&ck[id].ts) ? ab[id] : null }); });
  Object.keys(ck).forEach(id => { if (!seen.has(id) && ck[id] && ck[id].ts) out.push({ c:{ id, code:'#'+id, name:'(ไม่อยู่ในรายชื่อ)' }, id, ck: ck[id], ab: null }); });
  return out;
}
function clockOff(x){ const s = toMs(x.srv); if (!s || !x.ts) return 0; const d = (s - x.ts)/60000; if (x.off) return d < -2 ? Math.round(d) : 0; return Math.abs(d) > 5 ? Math.round(d) : 0; }
function stat(dep, day){
  const P = people(dep, day), s = { dep, n:P.length, inn:0, late:0, ab:0, no:0, flag:0, last:0 };
  P.forEach(p => { if (p.ck) { s.inn++; if (isLate(p.ck)) s.late++; if (clockOff(p.ck)) s.flag++; s.last = Math.max(s.last, p.ck.ts); } else if (p.ab) s.ab++; else s.no++; });
  return s;
}
window.__reg = r => { REG = REG===r ? '' : r; renderLive(); };
function renderLive(){
  if (!ME) return;
  $('dTitle').textContent = 'วันนี้ '+thDate(TKEY);
  const deps = depsInView(), S = deps.map(d => stat(d, TODAY[d]));
  const T = S.reduce((a,s)=>{ ['n','inn','late','ab','no','flag'].forEach(k=>a[k]+=s[k]); return a; }, {n:0,inn:0,late:0,ab:0,no:0,flag:0});
  const withData = S.filter(s => s.inn || s.ab).length;
  $('dSub').textContent = '• มีข้อมูล '+withData+'/'+deps.length+' สาขา' + (new Date().getDay()===0 ? ' • วันอาทิตย์ (ไม่นับใน On-time)' : '');
  const now = secOf(Date.now()), past = now > GRACE;
  const silent = S.filter(s => s.n && !s.inn && !s.ab && now > 7.5*3600);
  $('healthBar').innerHTML = silent.length ? '<div class="hbar" onclick="window.__dep(\''+silent[0].dep+'\')"><b>⚠️ '+silent.length+' สาขายังไม่มีการเช็คอินเลย</b><span>'+silent.slice(0,6).map(s=>s.dep).join(' • ')+(silent.length>6?' • และอีก '+(silent.length-6):'')+' — แตะดูรายละเอียด</span></div>' : '';
  const ot = T.inn ? Math.round((T.inn-T.late)/T.inn*1000)/10 : null;
  $('kpis').innerHTML = '<div class="kpis">'
    + '<div class="kpi '+(ot==null?'':ot>=95?'green':'red')+'"><div class="v">'+(ot==null?'—':ot+'%')+'</div><div class="l">Ontime รวม</div></div>'
    + '<div class="kpi '+(T.late?'red':'green')+'"><div class="v">'+T.late+'</div><div class="l">สายวันนี้</div></div>'
    + '<div class="kpi '+(T.no&&past?'red':T.no?'am':'green')+'"><div class="v">'+T.inn+'/'+(T.n-T.ab)+'</div><div class="l">เช็คอินแล้ว</div></div>'
    + '<div class="kpi am"><div class="v">'+T.ab+'</div><div class="l">ขาด / ลา</div></div>'
    + '<div class="kpi"><div class="v">'+withData+'/'+deps.length+'</div><div class="l">สาขาเริ่มลงเวลา'+(T.flag?' • ⏱'+T.flag:'')+'</div></div>'
    + '</div>';
  const regs = [...new Set(SCOPE.map(d => (DEPS[d]&&DEPS[d].region)||'').filter(Boolean))];

function openDep(dep, refresh){
  if (refresh && !$('mdl').classList.contains('show')) return;

  const D = DEPS[dep] || {}, day = TODAY[dep] || {}, P = people(dep, day), s = stat(dep, day);
  const ins = P.filter(p=>p.ck).sort((a,b)=>a.ck.ts-b.ck.ts), abs = P.filter(p=>p.ab), no = P.filter(p=>!p.ck&&!p.ab);
  const row = p => {
    const k = dep+'|'+p.id, off = p.ck ? clockOff(p.ck) : 0;
    const img = p.ck ? (PH[k] ? '<img class="thumb" src="'+PH[k]+'" onclick="window.__zoomImg(\''+k+'\')">' : '<div class="thumb" id="th_'+esc(dep)+'_'+esc(p.id)+'" style="display:grid;place-items:center;font-size:10px;color:#b0a892;">⏳</div>') : '';
    const chip = p.ck ? (isLate(p.ck) ? '<span class="chip no">✖ '+hm(p.ck.ts)+'</span>' : '<span class="chip ok">✔ '+hm(p.ck.ts)+'</span>')
               : p.ab ? '<span class="chip gr">'+esc(p.ab.note||'ขาด')+'</span>' : '<span class="chip '+(secOf(Date.now())>GRACE?'no':'wt')+'">ยังไม่ลง</span>';
    return '<div class="row-c">'+img+'<div class="info"><div class="nm">'+esc(p.c.name)+'</div><div class="sub2">'+esc(p.c.code)+' • '+esc(p.c.vendor||'-')
      + (p.ck ? ' • โดย '+esc(p.ck.staff||'-') : p.ab ? ' • โดย '+esc(p.ab.by||'-') : '')
      + (off ? ' • <b style="color:#b3121d">⏱ เวลาเครื่องต่าง '+Math.abs(off)+' นาที</b>' : '')
      + (p.ck && p.ck.off ? ' • 📴 ลงตอนออฟไลน์' : '') + '</div></div>'+chip+'</div>';
  };
  modal('<h3>'+esc(dep)+' · '+esc(D.name||'')+'</h3><div class="sub">'+thDate(TKEY)+' • เช็คอิน '+s.inn+'/'+(s.n-s.ab)+' • สาย '+s.late+' • ขาด/ลา '+s.ab+' • ยังไม่ลง '+s.no+'</div>'
    + (no.length ? '<div class="grp">⏳ ยังไม่ลงเวลา '+no.length+' คน</div>'+no.map(row).join('') : '')
    + (ins.length ? '<div class="grp">✓ เช็คอินแล้ว '+ins.length+' คน</div>'+ins.map(row).join('') : '')
    + (abs.length ? '<div class="grp">🚫 ขาด / ลา '+abs.length+' คน</div>'+abs.map(row).join('') : '')
    + (!P.length ? '<div class="empty">ยังไม่มีรายชื่อพนักงานในสาขานี้</div>' : '')
    + '<button class="btn btn-o btn-block" style="margin-top:12px" onclick="window.__close()">ปิด</button>');
  loadThumbs(dep, ins.map(p=>p.id));
}
async function loadThumbs(dep, ids){
  for (let i = 0; i < ids.length; i += 6) {
    await Promise.all(ids.slice(i, i+6).map(async id => {
      const k = dep+'|'+id; if (PH[k]) return;

      const el = document.getElementById('th_'+dep+'_'+id);

    }));
  }
}

async function createDepot(code, name, region, province, pin, staff){
  const uid = await fb.createUser(depotEmail(code, 1), pin);
  await fb.set('depots/'+code, { code, name, region, province, authUid: uid, authVer: 1, roster: [], createdAt: NOW });
  await fb.set('pub/depots', { [code]: { ver: 1, name } });
  if (staff && staff.length) await fb.set('pubstaff/'+code, { names: staff });
  PUB[code] = { ver: 1, name };
  if (!SCOPE.includes(code)) { SCOPE.push(code); SCOPE.sort(); watchDep(code); TUNS.push(fb.listen(`depots/${code}/days/${TKEY}`, d => { TODAY[code] = d || {}; sched(); })); }
  $('teamTag').textContent = 'UPC · '+ME.name+' · '+SCOPE.length+' สาขา';
  return await assignRegion(code, region);
}
/* สาขาใหม่ → เพิ่มให้ UPC Manager ของภาคนั้นอัตโนมัติ */
async function assignRegion(code, region){
  if (!region) return [];
  let L = []; try { L = (await fb.list('managers')).map(x => ({ uid:x.id, ...x.data })); } catch(e){}
  const got = [];
  for (const m of L) {
    if (m.role === 'admin' || m.region !== region) continue;
    const deps = m.depots || [];
    if (!deps.includes(code)) await fb.set('managers/'+m.uid, { depots: [...deps, code], updatedAt: NOW });
    got.push(m.name);
  }
  return got;
}

  $('bOut').innerHTML = '<table class="dtbl" style="margin-top:8px"><thead><tr><th class="l">รหัส</th><th class="l">ชื่อ</th><th>PIN</th><th>ผล</th></tr></thead><tbody>'
    + res.map(r=>'<tr><td class="l nm">'+esc(r[0])+'</td><td class="l">'+esc(r[1])+'</td><td><b>'+esc(r[2])+'</b></td><td>'+esc(r[3])+'</td></tr>').join('')+'</tbody></table>'
    + '<button class="btn btn-y btn-block" style="margin-top:10px" onclick="window.__bulkCsv()">📥 ดาวน์โหลดไฟล์ PIN (เก็บเป็นความลับ)</button>';
};
function depPicker(sel){
  const all = Object.keys(PUB).sort(), byR = {};
  all.forEach(d => { const r = (DEPS[d]&&DEPS[d].region)||'อื่น ๆ'; (byR[r] = byR[r]||[]).push(d); });
  return Object.keys(byR).map(r => '<label>'+esc(r)+' <a href="#" style="color:#D40511" onclick="document.querySelectorAll(\'[data-r=&quot;'+esc(r)+'&quot;]\').forEach(x=>x.checked=true);return false">เลือกทั้งภาค</a></label>'
    + '<div class="pick">'+byR[r].map(d=>'<label><input type="checkbox" class="mDep" data-r="'+esc(r)+'" value="'+esc(d)+'"'+(sel.includes(d)?' checked':'')+'> '+esc(d)+' '+esc(PUB[d].name||'')+'</label>').join('')+'</div>').join('')
    || '<div class="small">ยังไม่มีสาขา — เพิ่มสาขาก่อน</div>';
}
window.__aMgr = uid => {
  const m = uid ? MGRS.find(x=>x.uid===uid) : { name:'', role:'upc', depots:[], region:'' };
  modal(back('mgr')+'<h3>'+(uid?'แก้ไขผู้จัดการ':'เพิ่มผู้จัดการ (UPC)')+'</h3><div class="frm2">'
    + '<label>ชื่อ</label><input id="mName" value="'+esc(m.name)+'" placeholder="เช่น K.Somchai Jaidee">'
    + '<label>สิทธิ์</label><select id="mRole"><option value="upc"'+(m.role!=='admin'?' selected':'')+'>UPC Manager (เห็นเฉพาะสาขาที่เลือก)</option><option value="admin"'+(m.role==='admin'?' selected':'')+'>Admin (ทุกสาขา + จัดการระบบ)</option></select>'
    + '<label>ภาคที่ดูแล</label><select id="mReg" onchange="window.__pickReg(this.value)"><option value="">— ไม่ระบุ —</option>'+REGIONS.map(r=>'<option value="'+r+'"'+(m.region===r?' selected':'')+'>'+regLabel(r)+'</option>').join('')+'</select>'
    + '<div class="small" style="margin-top:4px">เลือกภาคแล้วระบบติ๊กสาขาในภาคให้อัตโนมัติ และสาขาใหม่ของภาคนี้จะถูกเพิ่มให้เอง</div>'
    + (uid ? '' : '<label>PIN ผู้จัดการ (6 หลัก)</label><input id="mPin" value="'+genPin()+'" inputmode="numeric" maxlength="6">')
    + '<label>สาขาที่ดูแล</label>'+depPicker(m.depots||[])
    + '<div class="err2" id="mErr"></div><button class="btn btn-y btn-block" id="mGo" onclick="window.__aMgrSave(\''+esc(uid||'')+'\')">'+(uid?'บันทึก':'สร้าง PIN ผู้จัดการ')+'</button><div id="mOut"></div></div>');
};
window.__aMgrSave = async uid => {
  const err = t => { $('mErr').textContent = t; $('mGo').disabled = false; };
  const name = $('mName').value.trim(), role = $('mRole').value, region = $('mReg').value, depots = [...document.querySelectorAll('.mDep:checked')].map(x=>x.value);
  if (!name) return err('กรอกชื่อ');
  if (role !== 'admin' && !depots.length && !region) return err('เลือกภาค หรือสาขาอย่างน้อย 1 สาขา');
  $('mGo').disabled = true;
  try {
    if (uid) { await fb.set('managers/'+uid, { name, role, region, depots, updatedAt: NOW }); feed('<b>บันทึกแล้ว</b>','ok'); return window.__settings('mgr'); }
    const pin = $('mPin').value.trim(); if (!/^\d{6}$/.test(pin)) return err('PIN ต้องเป็นตัวเลข 6 หลัก');
    let id; try { id = await fb.createUser(mgrEmail(pin), mgrPw(pin)); }
    catch(e){ if (e.code==='auth/email-already-in-use') { $('mPin').value = genPin(); return err('PIN นี้ถูกใช้แล้ว — สุ่ม PIN ใหม่ให้แล้ว กดอีกครั้ง'); } throw e; }
    await fb.set('managers/'+id, { name, role, region, depots, createdAt: NOW });
    $('mGo').style.display = 'none';
    $('mOut').innerHTML = credBox('ส่งให้ '+esc(name), ['ลิงก์: '+mgrUrl(), 'PIN ผู้จัดการ: '+pin, 'ภาค: '+regLabel(region), 'สาขา: '+(role==='admin'?'ทุกสาขา':(depots.join(', ')||'จะเพิ่มให้อัตโนมัติเมื่อสร้างสาขาในภาคนี้'))]);
  } catch(e){ err('ไม่สำเร็จ: '+(e.code||e.message)); }
};
const regDeps = r => Object.keys(PUB).filter(d => (DEPS[d]&&DEPS[d].region) === r).sort();
window.__pickReg = r => { const set = new Set(regDeps(r)); document.querySelectorAll('.mDep').forEach(x => { x.checked = set.has(x.value); }); };

/* ---- 📥 นำเข้าผู้จัดการหลายคน (เติมรายชื่อ UPC แต่ละภาคไว้ให้แล้ว) ---- */
window.__aMgrBulk = () => {
  const have = new Set(MGRS.map(m => m.name));
  const pre = UPC_LIST.filter(x => !have.has(x[0])).map(x => x.join('\t')).join('\n');
  modal(back('mgr')+'<h3>📥 นำเข้าผู้จัดการหลายคน</h3><div class="sub">2 คอลัมน์: <b>ชื่อ · ภาค</b> (Central / East / North / North-East / South) — ระบบสุ่ม PIN ให้ทุกคน และผูกสาขาในภาคให้อัตโนมัติ</div>'
    + '<div class="frm2"><textarea id="gText" rows="13">'+esc(pre)+'</textarea>'
    + '<div class="small" style="margin-top:4px">'+(pre ? 'เติมรายชื่อ UPC ทั้ง '+pre.split('\n').length+' คนไว้ให้แล้ว (คนที่มีในระบบแล้วจะไม่ถูกเติมซ้ำ)' : 'รายชื่อ UPC ทั้งหมดอยู่ในระบบแล้ว')+'</div>'
    + '<div class="err2" id="gErr"></div><button class="btn btn-y btn-block" id="gGo" onclick="window.__aMgrBulkGo()">สร้าง PIN ผู้จัดการ</button><div id="gOut"></div></div>');
};
window.__aMgrBulkGo = async () => {
  const rows = $('gText').value.split(/\r?\n/).map(l => l.split(l.includes('\t') ? '\t' : ',').map(x => x.trim())).filter(r => r[0] && !/^ชื่อ|^name/i.test(r[0]));
  if (!rows.length) { $('gErr').textContent = 'ไม่พบข้อมูล'; return; }
  $('gGo').disabled = true;
  const have = new Set(MGRS.map(m => m.name)), res = [];
  for (const [i, r] of rows.entries()) {
    const name = r[0], region = regOf(r[1]);
    $('gOut').innerHTML = '<div class="empty">กำลังสร้าง '+(i+1)+'/'+rows.length+' · '+esc(name)+'</div>';
    if (have.has(name)) { res.push([name, regLabel(region), '', '', '⏭ มีอยู่แล้ว']); continue; }
    if (!region) { res.push([name, r[1]||'', '', '', '❌ ไม่รู้จักภาค']); continue; }
    const depots = regDeps(region);
    let pin = '', id = null;
    for (let k = 0; k < 5 && !id; k++) {
      pin = genPin();
      try { id = await fb.createUser(mgrEmail(pin), mgrPw(pin)); } catch(e){ if (e.code !== 'auth/email-already-in-use') { res.push([name, regLabel(region), '', '', '❌ '+(e.code||e.message)]); break; } }
    }
    if (!id) continue;
    await fb.set('managers/'+id, { name, role:'upc', region, depots, createdAt: NOW });
    have.add(name); res.push([name, regLabel(region), pin, depots.length+' สาขา', '✅']);
  }
  const csv = '﻿'+[['ชื่อ','ภาค','PIN ผู้จัดการ','สาขา','ผล','ลิงก์'], ...res.map(r=>[...r, mgrUrl()])].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
  window.__mgrCsv = () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='upc_manager_pins.csv'; a.click(); };
  $('gGo').style.display = 'none';
  $('gOut').innerHTML = '<table class="dtbl" style="margin-top:8px"><thead><tr><th class="l">ชื่อ</th><th class="l">ภาค</th><th>PIN</th><th>สาขา</th><th>ผล</th></tr></thead><tbody>'
    + res.map(r=>'<tr><td class="l nm">'+esc(r[0])+'</td><td class="l">'+esc(r[1])+'</td><td><b>'+esc(r[2])+'</b></td><td>'+esc(r[3])+'</td><td>'+esc(r[4])+'</td></tr>').join('')+'</tbody></table>'
    + '<button class="btn btn-y btn-block" style="margin-top:10px" onclick="window.__mgrCsv()">📥 ดาวน์โหลดไฟล์ PIN ผู้จัดการ (เก็บเป็นความลับ)</button>';
};
window.__aMpin = uid => {
  const m = MGRS.find(x=>x.uid===uid);
  modal(back('mgr')+'<h3>PIN ใหม่ · '+esc(m.name)+'</h3><div class="sub">PIN เดิมใช้ไม่ได้ทันที · สาขาที่ดูแลเหมือนเดิม</div><div class="frm2">'
    + '<label>PIN ใหม่ (6 หลัก)</label><input id="wPin" value="'+genPin()+'" inputmode="numeric" maxlength="6"><div class="err2" id="wErr"></div>'
    + '<button class="btn btn-r btn-block" id="wGo" onclick="window.__aMpinGo(\''+esc(uid)+'\')">ยืนยัน</button><div id="wOut"></div></div>');
};
window.__aMpinGo = async uid => {
  const m = MGRS.find(x=>x.uid===uid), pin = $('wPin').value.trim();
  if (!/^\d{6}$/.test(pin)) { $('wErr').textContent = 'PIN ต้องเป็นตัวเลข 6 หลัก'; return; }
  $('wGo').disabled = true;
  try {
    let id; try { id = await fb.createUser(mgrEmail(pin), mgrPw(pin)); }
    catch(e){ if (e.code==='auth/email-already-in-use') { $('wPin').value = genPin(); $('wErr').textContent = 'PIN นี้ถูกใช้แล้ว — สุ่มใหม่ให้แล้ว กดอีกครั้ง'; $('wGo').disabled = false; return; } throw e; }
    await fb.set('managers/'+id, { name: m.name, role: m.role, depots: m.depots||[], createdAt: NOW });
    await fb.del('managers/'+uid);
    $('wGo').style.display = 'none';
    $('wOut').innerHTML = credBox('PIN ใหม่ของ '+esc(m.name), ['ลิงก์: '+mgrUrl(), 'PIN ผู้จัดการ: '+pin]);
  } catch(e){ $('wErr').textContent = 'ไม่สำเร็จ: '+(e.code||e.message); $('wGo').disabled = false; }
};
window.__aMdel = async uid => {
  const m = MGRS.find(x=>x.uid===uid);
  if (!confirm('ลบสิทธิ์ของ '+m.name+' ?\nPIN นี้จะเข้าดูข้อมูลไม่ได้อีก')) return;
  await fb.del('managers/'+uid); feed('<b>ลบสิทธิ์แล้ว</b>','ok'); window.__settings('mgr');
};
</script>
</body>
</html>
